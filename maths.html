<canvas id="confetti-canvas"></canvas>

<div class="app" id="app"></div>

<script>
/* ===================== UTILITIES ===================== */
const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const pick = (arr) => arr[rnd(0, arr.length - 1)];
const uid = () => Math.random().toString(36).slice(2, 10);
function shuffle(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){const j=rnd(0,i); [a[i],a[j]]=[a[j],a[i]];} return a; }
function fmt(n){ return Number.isInteger(n) ? n : Math.round(n*100)/100; }
// Builds a shuffled 4-item choice list from a correct value + candidate distractors,
// topping up with fallbackFn() if candidates collide with each other or the correct answer.
function makeChoices(correct, candidates, fallbackFn){
  const correctStr = String(correct);
  const set = new Set(candidates.map(String));
  set.delete(correctStr);
  let guard = 0;
  while (set.size < 3 && guard < 80){
    const c = String(fallbackFn());
    if (c !== correctStr) set.add(c);
    guard++;
  }
  return shuffle([correctStr, ...Array.from(set)].slice(0,4));
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); return b===0 ? a : gcd(b, a%b); }

/* ===================== SHAPE (SVG) HELPERS ===================== */
// Generates an "L / step" composite rectilinear shape:
// bounding box W x H, with a notch of width nw, height nh cut from the top-right corner.
// If nw=0 or nh=0, it's a plain rectangle.
function buildLShape(W, H, nw, nh){
  const pts = [
    [0,0], [W-nw,0], [W-nw,nh], [W,nh], [W,H], [0,H]
  ];
  const area = W*H - nw*nh;
  const segments = [
    {len: W-nw, label:'top'},
    {len: nh,   label:'notch-v'},
    {len: nw,   label:'notch-h'},
    {len: H-nh, label:'right'},
    {len: W,    label:'bottom'},
    {len: H,    label:'left'}
  ];
  const perimeter = segments.reduce((s,x)=>s+x.len,0);
  return {pts, area, perimeter, segments, W, H, nw, nh};
}

function shapeSVG(shape, unit, opts){
  opts = opts || {};
  const hideIndex = opts.hideIndex; // segment index to show as "?"
  const pad = 46;
  const maxDim = Math.max(shape.W, shape.H);
  const scale = Math.min(220 / shape.W, 190 / shape.H, 26);
  const vw = shape.W*scale + pad*2, vh = shape.H*scale + pad*2;
  const ox = pad, oy = pad;
  const P = shape.pts.map(([x,y]) => [ox + x*scale, oy + y*scale]);
  const pointsAttr = P.map(p => p.join(',')).join(' ');

  // label positions per segment (midpoint of each edge, offset outward)
  function mid(i,j,dx,dy,text,key){
    const [x1,y1]=P[i], [x2,y2]=P[j];
    const mx=(x1+x2)/2 + dx, my=(y1+y2)/2 + dy;
    const isHidden = hideIndex===key;
    return `<text x="${mx}" y="${my}" font-size="13" font-weight="800" fill="${isHidden?'#ef476f':'#232946'}" text-anchor="middle" dominant-baseline="middle" font-family="Trebuchet MS, Arial, sans-serif">${isHidden? '?' : text+unit}</text>`;
  }

  const labels = [
    mid(0,1, 0,-14, fmt(shape.segments[0].len), 0),
    mid(1,2, 22,0, fmt(shape.segments[1].len), 1),
    mid(2,3, 0,-14, fmt(shape.segments[2].len), 2),
    mid(3,4, 24,0, fmt(shape.segments[3].len), 3),
    mid(4,5, 0,18, fmt(shape.segments[4].len), 4),
    mid(5,0, -24,0, fmt(shape.segments[5].len), 5)
  ].join('');

  return `<svg width="${Math.min(vw,300)}" height="${Math.min(vh,260)}" viewBox="0 0 ${vw} ${vh}" xmlns="http://www.w3.org/2000/svg">
    <polygon points="${pointsAttr}" fill="#c9e8ff" stroke="#4361ee" stroke-width="3" stroke-linejoin="round"/>
    ${labels}
  </svg>`;
}

/* ===================== QUESTION BANK: SECTION "shapes" (Area & Perimeter) ===================== */
function genShapeQuestion(difficulty){
  const isRect = difficulty === 'easy' && Math.random() < 0.55;
  let W,H,nw,nh;
  if (difficulty === 'easy'){
    W = rnd(4,9); H = rnd(3,8);
    if (isRect){ nw=0; nh=0; } else { nw = rnd(1, Math.min(3,W-1)); nh = rnd(1, Math.min(3,H-1)); }
  } else if (difficulty === 'medium'){
    W = rnd(7,14); H = rnd(6,12);
    nw = rnd(2, Math.min(6,W-2)); nh = rnd(2, Math.min(6,H-2));
  } else { // hard
    W = rnd(12,40); H = rnd(10,30);
    nw = rnd(3, Math.min(15,W-3)); nh = rnd(3, Math.min(15,H-3));
  }
  const shape = buildLShape(W,H,nw,nh);
  const unit = pick(difficulty==='hard' ? ['m','km','cm'] : ['m','cm']);
  const mode = isRect ? pick(['area','perimeter']) : pick(['area','area','perimeter','perimeter','missing']);

  if (mode === 'area'){
    const correct = fmt(shape.area);
    const rawChoices = makeChoices(correct,
      [fmt(shape.W*shape.H), fmt(correct + rnd(2,8)), fmt(Math.max(1,correct - rnd(2,8)))],
      () => Math.max(1, correct + pick([-10,-6,6,10,-14,14]))
    );
    const choices = rawChoices.map(v=>`${v} ${unit}²`);
    return {
      id: uid(), section:'shapes', difficulty, type:'mcq',
      prompt: `Find the <b>area</b> of this composite shape.`,
      diagramSVG: shapeSVG(shape, unit, {}),
      choices, correctAnswer: `${correct} ${unit}²`,
      explanation: shape.nw===0
        ? `This is a simple rectangle, so Area = length × width = ${shape.W} × ${shape.H} = <b>${correct} ${unit}²</b>.`
        : `Split the shape into two rectangles.<br>Rectangle 1 (left, full height): ${shape.W-shape.nw} × ${shape.H} = ${(shape.W-shape.nw)*shape.H} ${unit}²<br>Rectangle 2 (bottom-right): ${shape.nw} × ${shape.H-shape.nh} = ${shape.nw*(shape.H-shape.nh)} ${unit}²<br>Total area = ${(shape.W-shape.nw)*shape.H} + ${shape.nw*(shape.H-shape.nh)} = <b>${correct} ${unit}²</b>.`
    };
  }
  if (mode === 'perimeter'){
    const correct = fmt(shape.perimeter);
    const wrongSum = fmt(shape.segments.slice(0,4).reduce((s,x)=>s+x.len,0)); // forgot 2 sides
    const distractors = new Set([wrongSum, fmt(correct+rnd(2,6)), fmt(Math.max(1,correct-rnd(2,6)))]);
    distractors.delete(correct);
    const choices = shuffle([correct, ...Array.from(distractors)].slice(0,4).map(v=>`${v} ${unit}`));
    const sumText = shape.segments.map(s=>fmt(s.len)).join(' + ');
    return {
      id: uid(), section:'shapes', difficulty, type:'mcq',
      prompt: `Find the <b>perimeter</b> of this shape (add up all the outer sides).`,
      diagramSVG: shapeSVG(shape, unit, {}),
      choices, correctAnswer: `${correct} ${unit}`,
      explanation: `Add every side going all the way around:<br>${sumText} = <b>${correct} ${unit}</b>.<br>Tip: opposite sides of the missing "step" always add up to the outer width and height!`
    };
  }
  // missing length
  const hideIndex = rnd(0,5);
  const missingVal = fmt(shape.segments[hideIndex].len);
  const others = shape.segments.filter((_,i)=>i!==hideIndex).reduce((s,x)=>s+x.len,0);
  const correct = missingVal;
  const rawChoices = makeChoices(correct,
    [fmt(correct+rnd(1,4)), fmt(Math.max(1,correct-rnd(1,4))), fmt(shape.perimeter)],
    () => fmt(Math.max(1, correct + pick([-6,-5,5,6,-7,7])))
  );
  const choices = rawChoices.map(v=>`${v} ${unit}`);
  return {
    id: uid(), section:'shapes', difficulty, type:'mcq',
    prompt: `The perimeter of this shape is <b>${fmt(shape.perimeter)} ${unit}</b>. What is the length of the missing side (shown as "?")?`,
    diagramSVG: shapeSVG(shape, unit, {hideIndex}),
    choices, correctAnswer: `${correct} ${unit}`,
    explanation: `Add up the 5 known sides: ${others} ${unit}.<br>Perimeter − known sides = missing side:<br>${fmt(shape.perimeter)} − ${others} = <b>${correct} ${unit}</b>.`
  };
}

/* ===================== QUESTION BANK: SECTION "laws" (Laws of Arithmetic) ===================== */
function genLawsQuestion(difficulty){
  const kind = difficulty === 'easy'
    ? pick(['calcOrder','calcOrder','operatorFill'])
    : difficulty === 'medium'
      ? pick(['reorderMCQ','missingChain','calcOrder','operatorFill','regroupCalc'])
      : pick(['missingChain','distributive','reorderMCQ','calcOrder','regroupCalc']);

  if (kind === 'operatorFill'){
    const b = rnd(2,9), c = rnd(2,9), prod = b*c;
    const a = rnd(5,60);
    let chosenOp = pick(['+','−']);
    let result = chosenOp === '+' ? a+prod : a-prod;
    if (result < 0){ chosenOp = '+'; result = a+prod; }
    return {
      id: uid(), section:'laws', difficulty, type:'mcq',
      prompt: `Which operator belongs in the gap to make this correct?<br><span class="math" style="font-size:1.3rem">${a} <b>?</b> ${b} × ${c} = ${result}</span>`,
      diagramSVG: null,
      choices: shuffle(['+','−','×','÷']), correctAnswer: chosenOp,
      explanation: `Multiplication happens before addition or subtraction (order of operations).<br>${b} × ${c} = ${prod}.<br>${a} ${chosenOp} ${prod} = <b>${result}</b>.`
    };
  }

  if (kind === 'calcOrder'){
    const type = pick(['addDiv','subMul','mulSub','divAdd']);
    let a,b,c,correct,exprText,explanation,wrongLeftToRight;
    if (type === 'addDiv'){
      c = rnd(2,6); const q = rnd(2,9); b = c*q; a = rnd(5,40);
      correct = a + q; exprText = `${a} + ${b} ÷ ${c}`;
      wrongLeftToRight = Math.round(((a+b)/c)*100)/100;
      explanation = `Divide first: ${b} ÷ ${c} = ${q}.<br>Then add: ${a} + ${q} = <b>${correct}</b>.`;
    } else if (type === 'subMul'){
      b = rnd(2,9); c = rnd(2,9); const prod = b*c; a = rnd(prod+5, prod+60);
      correct = a - prod; exprText = `${a} − ${b} × ${c}`;
      wrongLeftToRight = (a-b)*c;
      explanation = `Multiply first: ${b} × ${c} = ${prod}.<br>Then subtract: ${a} − ${prod} = <b>${correct}</b>.`;
    } else if (type === 'mulSub'){
      a = rnd(2,9); b = rnd(2,9); const prod = a*b; c = rnd(1, Math.max(1,prod-5));
      correct = prod - c; exprText = `${a} × ${b} − ${c}`;
      wrongLeftToRight = a*(b-c);
      explanation = `Multiply first: ${a} × ${b} = ${prod}.<br>Then subtract: ${prod} − ${c} = <b>${correct}</b>.`;
    } else {
      b = rnd(2,9); const q = rnd(2,9); a = b*q; c = rnd(2,40);
      correct = q + c; exprText = `${a} ÷ ${b} + ${c}`;
      wrongLeftToRight = Math.round((a/(b+c))*100)/100;
      explanation = `Divide first: ${a} ÷ ${b} = ${q}.<br>Then add: ${q} + ${c} = <b>${correct}</b>.`;
    }
    const choices = makeChoices(correct,
      [wrongLeftToRight, correct+rnd(1,4), Math.max(0,correct-rnd(1,4))],
      () => Math.max(0, correct + pick([-6,6,-8,8,-5,5]))
    );
    return {
      id: uid(), section:'laws', difficulty, type:'mcq',
      prompt: `Calculate, using the correct order of operations:<br><span class="math" style="font-size:1.3rem">${exprText}</span>`,
      diagramSVG: null,
      choices, correctAnswer: String(correct),
      explanation
    };
  }

  if (kind === 'regroupCalc'){
    const a = rnd(2,9), b = rnd(2,9), c = rnd(2,9);
    const correct = a*b*c;
    const choices = makeChoices(correct,
      [a*b+c, (a+b)*c, correct+rnd(2,10)],
      () => Math.max(1, correct + pick([-5,5,-8,8,-3,3]))
    );
    return {
      id: uid(), section:'laws', difficulty, type:'mcq',
      prompt: `Using the associative law to regroup the multiplication, calculate:<br><span class="math" style="font-size:1.3rem">${a} × ${b} × ${c}</span><br>(Hint: try (${a} × ${c}) × ${b} first.)`,
      diagramSVG: null,
      choices, correctAnswer: String(correct),
      explanation: `The associative law lets you multiply in any order:<br>(${a} × ${c}) × ${b} = ${a*c} × ${b} = <b>${correct}</b>.<br>${a} × ${b} × ${c} always equals ${correct}, however you group it.`
    };
  }

  if (kind === 'reorderMCQ'){
    const a = pick([2,4,5,10,20,25,50]);
    const b = rnd(2,9);
    const c = pick([2,4,5,8,10]);
    const product = a*b*c;
    const correctRegroup = `(${a} × ${c}) × ${b} = ${a*c} × ${b}`;
    const options = shuffle([
      correctRegroup,
      `${a} + ${b} × ${c}`,
      `(${a} × ${b}) − ${c}`,
      `${a} × (${b} + ${c})`
    ]);
    return {
      id: uid(), section:'laws', difficulty, type:'mcq',
      prompt: `Which is the easiest way to work out ${a} × ${b} × ${c} mentally, without changing the answer?`,
      diagramSVG: null,
      choices: options, correctAnswer: correctRegroup,
      explanation: `${a} × ${b} × ${c} = ${product}.<br>The associative law lets you regroup the multiplication in any order:<br>(${a} × ${c}) × ${b} = ${a*c} × ${b} = ${product}. The other options change the value because they don't just regroup multiplication.`
    };
  }

  if (kind === 'missingChain'){
    const a = rnd(12,30);
    const factor = pick([2,3,4,5,6]);
    const b = factor * rnd(2,7);
    const product = a*b;
    const missing = b/factor;
    const choices = makeChoices(missing,
      [missing+1, Math.max(1,missing-1), factor],
      () => Math.max(1, missing + pick([-2,2,3,-3]))
    );
    return {
      id: uid(), section:'laws', difficulty, type:'mcq',
      prompt: `Fill in the missing number: ${a} × ${b} = ${a} × <span class="math">?</span> × ${factor}`,
      diagramSVG: null,
      choices, correctAnswer: String(missing),
      explanation: `${b} can be split into ${missing} × ${factor} (since ${missing} × ${factor} = ${b}).<br>So ${a} × ${b} = ${a} × ${missing} × ${factor} = ${product}.`
    };
  }

  // distributive — split a number into a round part plus a remainder, mirroring
  // the official-exam pattern "18 × 15 = (18 × 10) + (18 × ?)".
  const roundPart = pick([10,20,30,40]);
  const missing = rnd(2,9);
  const full = roundPart + missing;
  const mult = rnd(12,40);
  const choices = makeChoices(missing,
    [missing+1, Math.max(1,missing-1), roundPart],
    () => Math.max(1, missing + pick([2,-2,3,-3]))
  );
  return {
    id: uid(), section:'laws', difficulty, type:'mcq',
    prompt: `Use the distributive law to fill in the missing number:<br><span class="math" style="font-size:1.3rem">${mult} × ${full} = (${mult} × ${roundPart}) + (${mult} × <span class="math">?</span>)</span>`,
    diagramSVG: null,
    choices, correctAnswer: String(missing),
    explanation: `${full} = ${roundPart} + ${missing}, so ${mult} × ${full} = (${mult} × ${roundPart}) + (${mult} × ${missing}).<br>This trick (the distributive law) makes multiplying by a round number, plus a bit more, much faster mentally.`
  };
}

/* ===================== QUESTION BANK: SECTION "fractions" ===================== */
function genFractionQuestion(difficulty){
  const kind = difficulty === 'easy' ? pick(['missingNum','improperMixed','fractionOfAmount'])
    : difficulty === 'medium' ? pick(['missingNum','simplify','addFractions','fractionOfAmount','orderFractions'])
    : pick(['simplify','addFractions','orderFractions','improperMixed']);

  if (kind === 'missingNum'){
    let a,b,k;
    if (difficulty === 'easy'){ a = rnd(1,4); b = rnd(a+1,8); k = rnd(2,3); }
    else if (difficulty === 'medium'){ a = rnd(2,6); b = rnd(a+2,10); k = rnd(2,5); }
    else { a = rnd(3,9); b = rnd(a+3,14); k = rnd(2,6); }
    const num2 = a*k, den2 = b*k;
    const hideNum = Math.random() < 0.5;
    const missing = hideNum ? num2 : den2;
    const distractorSet = new Set([String(missing+k), String(Math.max(1,missing-k)), String(missing+1)]);
    distractorSet.delete(String(missing));
    const choices = shuffle([String(missing), ...Array.from(distractorSet)].slice(0,4));
    return {
      id: uid(), section:'fractions', difficulty, type:'mcq',
      prompt: `Fill in the missing number to make an equivalent fraction:<br><span class="math" style="font-size:1.3rem">${a}/${b} = ${hideNum?'?':num2}/${hideNum?den2:'?'}</span>`,
      diagramSVG: null,
      choices, correctAnswer: String(missing),
      explanation: `To get from ${hideNum?b:a} to ${hideNum?den2:num2} you multiply by ${k} (since ${hideNum?b:a} × ${k} = ${hideNum?den2:num2}).<br>Do the same to the other part: ${hideNum?a:b} × ${k} = <b>${missing}</b>.<br>So ${a}/${b} = ${num2}/${den2}.`
    };
  }

  if (kind === 'simplify'){
    let a0,b0;
    do { a0 = rnd(2,6); b0 = rnd(2,9); } while (gcd(a0,b0) !== 1 || a0 >= b0);
    const g = rnd(2, difficulty==='hard' ? 7 : 5);
    const a = a0*g, b = b0*g;
    const correct = `${a0}/${b0}`;
    const distractorSet = new Set([`${a0+1}/${b0}`, `${a0}/${b0+1}`, `${g}/${g+1}`, `${a0}/${b0-1>0?b0-1:b0+2}`]);
    distractorSet.delete(correct);
    const choices = shuffle([correct, ...Array.from(distractorSet)].slice(0,4));
    return {
      id: uid(), section:'fractions', difficulty, type:'mcq',
      prompt: `Write <span class="math">${a}/${b}</span> in its simplest form.`,
      diagramSVG: null,
      choices, correctAnswer: correct,
      explanation: `The highest common factor of ${a} and ${b} is ${g}.<br>${a} ÷ ${g} = ${a0} and ${b} ÷ ${g} = ${b0}.<br>So ${a}/${b} = <b>${a0}/${b0}</b>.`
    };
  }

  if (kind === 'improperMixed'){
    const whole = rnd(1, difficulty==='hard' ? 9 : 5);
    const den = rnd(2,8);
    const rem = rnd(1,den-1);
    const num = whole*den + rem;
    const correct = `${whole} ${rem}/${den}`;
    const distractorSet = new Set([`${whole+1} ${rem}/${den}`, `${whole} ${rem+1}/${den}`, `${Math.max(0,whole-1)} ${rem}/${den}`]);
    distractorSet.delete(correct);
    const choices = shuffle([correct, ...Array.from(distractorSet)].slice(0,4));
    return {
      id: uid(), section:'fractions', difficulty, type:'mcq',
      prompt: `Write <span class="math">${num}/${den}</span> as a mixed number.`,
      diagramSVG: null,
      choices, correctAnswer: correct,
      explanation: `${den} goes into ${num} a total of ${whole} whole times (${whole} × ${den} = ${whole*den}), leaving a remainder of ${num} − ${whole*den} = ${rem}.<br>So ${num}/${den} = <b>${whole} ${rem}/${den}</b>.`
    };
  }

  if (kind === 'addFractions'){
    const den = pick([4,6,8,10,12]);
    let n1 = rnd(1,den-1), n2 = rnd(1,den-1);
    const sumNum = n1+n2;
    const wholePart = Math.floor(sumNum/den);
    const remPart = sumNum % den;
    const g = remPart ? gcd(remPart,den) : den;
    const sn = remPart ? remPart/g : 0, sd = remPart ? den/g : 1;
    const correct = wholePart > 0
      ? (remPart ? `${wholePart} ${sn}/${sd}` : `${wholePart}`)
      : `${sn}/${sd}`;
    const choices = makeChoices(correct,
      [`${sumNum}/${den}`, `${n1}/${den}`, `${n2}/${den}`, `${sn+1}/${sd}`, `${Math.max(0,sn-1)}/${sd}`],
      () => { const r = rnd(1,den*2-1); const d2 = pick([den, den*2]); return `${r}/${d2}`; }
    );
    return {
      id: uid(), section:'fractions', difficulty, type:'mcq',
      prompt: `Calculate:<br><span class="math" style="font-size:1.3rem">${n1}/${den} + ${n2}/${den}</span>`,
      diagramSVG: null,
      choices, correctAnswer: correct,
      explanation: `Since both fractions already share the same denominator, just add the numerators:<br>${n1}/${den} + ${n2}/${den} = ${sumNum}/${den}${wholePart>0?` = ${wholePart} ${remPart}/${den} (in lowest terms, <b>${correct}</b>)`:` = <b>${correct}</b> (in lowest terms)`}.`
    };
  }

  if (kind === 'fractionOfAmount'){
    const den = pick([3,4,5,6,8]);
    const num = rnd(1,den-1);
    const multiplier = rnd(2,9);
    const total = den*multiplier;
    const correct = num*multiplier;
    const choices = makeChoices(correct,
      [total, correct+multiplier, Math.max(1,correct-multiplier)],
      () => Math.max(1, correct + pick([-multiplier*2, multiplier*2, -1, 1, 2, -2]))
    );
    return {
      id: uid(), section:'fractions', difficulty, type:'mcq',
      prompt: `Find <span class="math">${num}/${den}</span> of ${total}.`,
      diagramSVG: null,
      choices, correctAnswer: String(correct),
      explanation: `${total} ÷ ${den} = ${multiplier} (one part).<br>${num}/${den} of ${total} = ${num} × ${multiplier} = <b>${correct}</b>.`
    };
  }

  // orderFractions
  const den = pick([6,8,12,10]);
  const nums = shuffle(Array.from({length: den-1}, (_,i)=>i+1)).slice(0,4);
  const fracs = nums.map(n => ({n, d:den, v:n/den}));
  const sorted = [...fracs].sort((a,b)=>a.v-b.v).map(f=>`${f.n}/${f.d}`);
  const correct = sorted.join(', ');
  const wrong1 = [...sorted].reverse().join(', ');
  const choices = makeChoices(correct,
    [wrong1],
    () => shuffle(sorted).join(', ')
  );
  return {
    id: uid(), section:'fractions', difficulty, type:'mcq',
    prompt: `Put these fractions in order from <b>smallest to largest</b>:<br><span class="math" style="font-size:1.2rem">${fracs.map(f=>`${f.n}/${f.d}`).join(',  ')}</span>`,
    diagramSVG: null,
    choices, correctAnswer: correct,
    explanation: `Since all the fractions share the same denominator (${den}), just compare the numerators.<br>In order from smallest to largest: <b>${correct}</b>.`
  };
}

/* ===================== QUESTION BANK: SECTION "placeValue" ===================== */
function genPlaceValueQuestion(difficulty){
  const kind = pick(['digitValue','multiplyChain','wordsToFigures','expandedForm']);

  if (kind === 'digitValue'){
    const whole = rnd(1, difficulty==='hard' ? 90 : 60);
    const d1 = rnd(1,9), d2 = rnd(1,9);
    const numStr = `${whole}.${d1}${d2}`;
    const askTenths = Math.random() < 0.5;
    const digit = askTenths ? d1 : d2;
    const place = askTenths ? 'tenths' : 'hundredths';
    const value = askTenths ? digit/10 : digit/100;
    const correct = String(value);
    const choices = makeChoices(correct,
      [digit, askTenths ? digit/100 : digit/10, value*10],
      () => fmt(value + pick([0.01,-0.01,0.1,-0.1,0.02,-0.02]))
    );
    return {
      id: uid(), section:'placeValue', difficulty, type:'mcq',
      prompt: `What is the value of the digit <b>${digit}</b> in the number <b>${numStr}</b>?`,
      diagramSVG: null,
      choices, correctAnswer: correct,
      explanation: `In ${numStr}, the digit ${digit} is in the ${place} place, so its value is <b>${correct}</b>.`
    };
  }

  if (kind === 'multiplyChain'){
    const factor = pick([10,100,1000]);
    const op = pick(['×','÷']);
    const base = op === '÷' ? rnd(Math.ceil(factor/5), factor*9) : rnd(2,95);
    const result = op === '×' ? base*factor : Math.round((base/factor)*10000)/10000;
    const choices = makeChoices(result,
      [op==='×'?base/factor:base*factor, result*10, result/10],
      () => Math.max(0.0001, fmt(result + pick([-Math.max(0.01,result*0.5), result*0.5, result*2, -Math.max(0.01,result*0.2)])))
    );
    return {
      id: uid(), section:'placeValue', difficulty, type:'mcq',
      prompt: `Complete the number sentence:<br><span class="math" style="font-size:1.3rem">${base} ${op} ${factor} = ?</span>`,
      diagramSVG: null,
      choices, correctAnswer: String(result),
      explanation: `${op === '×' ? 'Multiplying' : 'Dividing'} by ${factor} moves every digit ${Math.log10(factor)} place${factor>10?'s':''} ${op==='×'?'to the left':'to the right'}.<br>${base} ${op} ${factor} = <b>${result}</b>.`
    };
  }

  if (kind === 'wordsToFigures'){
    const thousands = rnd(100,999);
    const hundreds = rnd(1,9);
    const tensUnits = rnd(0,99);
    const num = thousands*1000 + hundreds*100 + tensUnits;
    const numWords = `${numberToWordsThousands(thousands)} thousand, ${numberToWordsHundreds(hundreds*100+tensUnits)}`;
    const correct = String(num);
    const choices = makeChoices(correct,
      [num+100, num-10, thousands*1000 + tensUnits*10 + hundreds],
      () => Math.max(1, num + pick([-200,200,-50,50,-500,500]))
    );
    return {
      id: uid(), section:'placeValue', difficulty, type:'mcq',
      prompt: `Which number is written as: "<b>${numWords}</b>"?`,
      diagramSVG: null,
      choices, correctAnswer: correct,
      explanation: `"${numWords}" written in figures is <b>${correct}</b>.`
    };
  }

  // expandedForm
  const th = rnd(1,9), h = rnd(0,9), t = rnd(0,9), o = rnd(0,9), tenths = rnd(1,9);
  const num = th*1000 + h*100 + t*10 + o + tenths/10;
  const parts = [`${th*1000}`, h?`${h*100}`:null, t?`${t*10}`:null, o?`${o}`:null, `${tenths/10}`].filter(Boolean);
  const expandedStr = parts.join(' + ');
  const correct = fmt(num);
  const choices = makeChoices(correct,
    [fmt(num + rnd(1,9)), th*1000 + h*100 + t*10 + o, fmt(num*10)],
    () => fmt(Math.max(1, correct + pick([-5,5,-1,1,0.2,-0.2])))
  );
  return {
    id: uid(), section:'placeValue', difficulty, type:'mcq',
    prompt: `Which number is the same as:<br><span class="math" style="font-size:1.2rem">${expandedStr}</span>`,
    diagramSVG: null,
    choices, correctAnswer: String(correct),
    explanation: `Adding all the parts together: ${expandedStr} = <b>${correct}</b>.`
  };
}
function numberToWordsHundreds(n){
  const ones = ['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const tensWords = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  if (n === 0) return 'zero';
  let out = '';
  const h = Math.floor(n/100), rem = n%100;
  if (h) out += `${ones[h]} hundred${rem?' and ':''}`;
  if (rem){
    if (rem < 20) out += ones[rem];
    else { out += tensWords[Math.floor(rem/10)]; if (rem%10) out += `-${ones[rem%10]}`; }
  }
  return out || 'zero';
}
function numberToWordsThousands(n){ return numberToWordsHundreds(n); }

/* ===================== QUESTION BANK: SECTION "rounding" ===================== */
function genRoundingQuestion(difficulty){
  const kind = pick(['roundTo','smallestPossible','roundsToWhich']);

  if (kind === 'roundTo'){
    const place = pick(difficulty==='hard' ? [10,100,1000] : [10,100]);
    const num = rnd(place, place*99) + rnd(0,9);
    const correct = Math.round(num/place)*place;
    const choices = makeChoices(correct,
      [Math.floor(num/place)*place, Math.ceil(num/place)*place, correct+place, correct-place],
      () => correct + place*pick([-3,-2,2,3])
    );
    return {
      id: uid(), section:'rounding', difficulty, type:'mcq',
      prompt: `Round <b>${num.toLocaleString()}</b> to the nearest <b>${place}</b>.`,
      diagramSVG: null,
      choices: choices.map(c=>Number(c).toLocaleString()), correctAnswer: correct.toLocaleString(),
      explanation: `${num.toLocaleString()} is between ${Math.floor(num/place)*place} and ${Math.ceil(num/place)*place}.<br>Rounded to the nearest ${place}, it becomes <b>${correct.toLocaleString()}</b>.`
    };
  }

  if (kind === 'smallestPossible'){
    const place = pick([10,100]);
    const rounded = rnd(2,40)*place;
    const smallest = rounded - place/2;
    const choices = makeChoices(smallest,
      [rounded, rounded+place/2, rounded-place],
      () => smallest + place*pick([-2,-1,1,2])
    );
    return {
      id: uid(), section:'rounding', difficulty, type:'mcq',
      prompt: `A stadium holds <b>${rounded.toLocaleString()}</b> people, when rounded to the nearest ${place}. What is the <b>smallest</b> possible number of people the stadium could actually hold?`,
      diagramSVG: null,
      choices: choices.map(c=>Number(c).toLocaleString()), correctAnswer: smallest.toLocaleString(),
      explanation: `Any number from ${(rounded-place/2).toLocaleString()} up to (but not including) ${(rounded+place/2).toLocaleString()} rounds to ${rounded.toLocaleString()}.<br>So the smallest possible number is <b>${smallest.toLocaleString()}</b>.`
    };
  }

  // roundsToWhich
  const target = rnd(20,90);
  const correctVal = fmt(target - 0.5 + Math.random()*0.99);
  const correct = correctVal.toFixed(2).replace(/0$/,'').replace(/\.$/,'');
  const options = makeChoices(correct,
    [target+1, target-1, fmt(target+0.6)],
    () => fmt(target + pick([2,-2,0.6,-0.6]) + rnd(0,1))
  );
  return {
    id: uid(), section:'rounding', difficulty, type:'mcq',
    prompt: `Which of these numbers rounds to <b>${target}</b> (to the nearest whole number)?`,
    diagramSVG: null,
    choices: options, correctAnswer: correct,
    explanation: `${correct} is less than half a unit away from ${target}, so it rounds to <b>${target}</b>. The other options round to a different whole number.`
  };
}

/* ===================== QUESTION BANK: SECTION "triangularNumbers" ===================== */

    };
  }

  if (kind === 'whichIs'){

    return {
      id: uid(), section:'triangularNumbers', difficulty, type:'mcq',
      prompt: `Which of these numbers is a <b>triangular number</b>?`,
      diagramSVG: null,
      choices, correctAnswer: String(correct),
      explanation: `${correct} is a triangular number because it is the sum 1+2+…+${n} (the ${ordinal(n)} triangular number). The other numbers can't be made this way.`
    };
  }

  // consecutiveSum
  const n = rnd(2,9);
  const sum = triangular(n) + triangular(n+1);
  const correct = (n+1)*(n+1);
  const choices = makeChoices(correct,
    [sum+1, triangular(n+2), sum-1],
    () => Math.max(1, correct + pick([-3,-2,2,3]))
  );
  return {
    id: uid(), section:'triangularNumbers', difficulty, type:'mcq',
    prompt: `The ${ordinal(n)} triangular number (${triangular(n)}) is added to the ${ordinal(n+1)} triangular number (${triangular(n+1)}). What is the total?`,
    diagramSVG: null,
    choices, correctAnswer: String(correct),
    explanation: `${triangular(n)} + ${triangular(n+1)} = <b>${correct}</b>.<br>Fun fact: adding any two consecutive triangular numbers always makes a square number — here, ${correct} = ${n+1} × ${n+1}!`
  };
}
function ordinal(n){
  const s = ['th','st','nd','rd'];
  const v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}

function mode(arr){
  const counts = {};
  arr.forEach(n => counts[n] = (counts[n]||0)+1);
  let best = arr[0], bestCount = 0;
  Object.entries(counts).forEach(([k,v]) => { if (v > bestCount){ best = Number(k); bestCount = v; } });
  return best;
}
function median(arr){
  const s = [...arr].sort((a,b)=>a-b);
  const mid = Math.floor(s.length/2);
  return s.length % 2 ? s[mid] : fmt((s[mid-1]+s[mid])/2);
}

    return {

    );
    const fruit = pick(['apples','bananas','oranges','grapes']);

    };
  }

  // bestGraph

    {text:"Showing a small number of items using repeated picture symbols, like 🍎 = 2 apples", answer:'Pictogram', why:'it uses repeated pictures to represent a count'}

    const choices = makeChoices(correct,
      [180-a, a+b, correct+10],
      () => Math.max(1, correct + pick([-15,-5,5,15,-20,20]))
    );
    return {
      id: uid(), section:'angles', difficulty, type:'mcq',
      prompt: `A triangle has two angles measuring <b>${a}°</b> and <b>${b}°</b>. What is the size of the third angle?`,
      diagramSVG: null,
      choices: choices.map(c=>`${c}°`), correctAnswer: `${correct}°`,
      explanation: `The angles inside any triangle always add up to 180°.<br>180 − ${a} − ${b} = <b>${correct}°</b>.`
    };
  }

  // classify
  const deg = rnd(5,355);
  let correct;
  if (deg < 90) correct = 'Acute';
  else if (deg === 90) correct = 'Right';
  else if (deg < 180) correct = 'Obtuse';
  else correct = 'Reflex';
  const choices = shuffle(['Acute','Right','Obtuse','Reflex']);
  return {
    id: uid(), section:'angles', difficulty, type:'mcq',
    prompt: `An angle measures <b>${deg}°</b>. Which word describes this angle?`,
    diagramSVG: null,
    choices, correctAnswer: correct,
    explanation: `${deg}° is ${correct==='Acute'?'less than 90°':correct==='Right'?'exactly 90°':correct==='Obtuse'?'between 90° and 180°':'between 180° and 360°'}, so it is <b>${correct.toLowerCase()}</b>.`
  };
}

/* ===================== QUESTION BANK: SECTION "addition" ===================== */
function genAdditionQuestion(difficulty){
  const kind = pick(['bigAdd','wordProblem','missingDigit']);
  const digits = difficulty==='hard' ? 5 : difficulty==='medium' ? 4 : 3;

  if (kind === 'bigAdd'){
    const a = rnd(Math.pow(10,digits-1), Math.pow(10,digits)-1);
    const b = rnd(Math.pow(10,digits-1), Math.pow(10,digits)-1);
    const correct = a+b;
    const distractorSet = new Set([String(correct+10), String(correct-10), String(correct+100)]);
    distractorSet.delete(String(correct));
    const choices = shuffle([String(correct), ...Array.from(distractorSet)].slice(0,4));
    return {
      id: uid(), section:'addition', difficulty, type:'mcq',
      prompt: `Calculate:<br><span class="math" style="font-size:1.3rem">${a.toLocaleString()} + ${b.toLocaleString()}</span>`,
      diagramSVG: null,
      choices: choices.map(c=>Number(c).toLocaleString()), correctAnswer: correct.toLocaleString(),
      explanation: `${a.toLocaleString()} + ${b.toLocaleString()} = <b>${correct.toLocaleString()}</b>.`
    };
  }

  if (kind === 'wordProblem'){
    const ctx = pick([
      {item:'fiction books', item2:'non-fiction books', place:'library', thing:'books'},
      {item:'red marbles', item2:'blue marbles', place:'jar', thing:'marbles'},
      {item:'adult tickets', item2:'child tickets', place:'cinema', thing:'tickets'}
    ]);
    const a = rnd(Math.pow(10,digits-2), Math.pow(10,digits-1));
    const b = rnd(Math.pow(10,digits-2), Math.pow(10,digits-1));
    const correct = a+b;
    const choices = makeChoices(correct,
      [correct+100, Math.abs(a-b), correct-50],
      () => Math.max(1, correct + pick([-20,20,-30,30,-10,10]))
    );
    return {
      id: uid(), section:'addition', difficulty, type:'mcq',
      prompt: `A ${ctx.place} has ${a.toLocaleString()} ${ctx.item} and ${b.toLocaleString()} ${ctx.item2}. How many ${ctx.thing} does it have altogether?`,
      diagramSVG: null,
      choices: choices.map(c=>Number(c).toLocaleString()), correctAnswer: correct.toLocaleString(),
      explanation: `${a.toLocaleString()} + ${b.toLocaleString()} = <b>${correct.toLocaleString()}</b> ${ctx.thing}.`
    };
  }

  // missingDigit
  const a = rnd(100,899), b = rnd(100,899-a>0?899-a:100);
  const sum = a+b;
  const sumStr = String(sum);
  const idx = rnd(0, sumStr.length-1);
  const correctDigit = sumStr[idx];
  const distractorSet = new Set();
  while (distractorSet.size < 3){
    const d = String(rnd(0,9));
    if (d !== correctDigit) distractorSet.add(d);
  }
  const choices = shuffle([correctDigit, ...Array.from(distractorSet)]);
  const masked = sumStr.split('').map((d,i)=> i===idx ? '?' : d).join('');
  return {
    id: uid(), section:'addition', difficulty, type:'mcq',
    prompt: `${a} + ${b} = ${masked}<br>What is the missing digit (shown as "?")?`,
    diagramSVG: null,
    choices, correctAnswer: correctDigit,
    explanation: `${a} + ${b} = <b>${sum}</b>, so the missing digit is <b>${correctDigit}</b>.`
  };
}

/* ===================== QUESTION BANK: SECTION "multiplication" ===================== */
function genMultiplicationQuestion(difficulty){
  const kind = pick(['bigMul','factors','squareNum']);

  if (kind === 'bigMul'){
    const a = rnd(difficulty==='hard'?200:100, difficulty==='hard'?899:499);
    const b = rnd(12,29);
    const correct = a*b;
    const distractorSet = new Set([String(correct+a), String(correct-a), String(correct+10)]);
    distractorSet.delete(String(correct));
    const choices = shuffle([String(correct), ...Array.from(distractorSet)].slice(0,4));
    return {
      id: uid(), section:'multiplication', difficulty, type:'mcq',
      prompt: `Calculate:<br><span class="math" style="font-size:1.3rem">${a} × ${b}</span>`,
      diagramSVG: null,
      choices: choices.map(c=>Number(c).toLocaleString()), correctAnswer: correct.toLocaleString(),
      explanation: `${a} × ${b} = <b>${correct.toLocaleString()}</b>.`
    };
  }

  if (kind === 'factors'){
    const target = pick([12,16,18,20,24,28,30,36,40]);
    const allFactors = [];
    for (let i=1;i<=target;i++) if (target % i === 0) allFactors.push(i);
    const notFactor = pick(Array.from({length:target+5}, (_,i)=>i+1).filter(n => target % n !== 0));
    const factorsChoices = shuffle(allFactors).slice(0,3);
    const choices = shuffle([String(notFactor), ...factorsChoices.map(String)]);
    return {
      id: uid(), section:'multiplication', difficulty, type:'mcq',
      prompt: `Which of these numbers is <b>NOT</b> a factor of <b>${target}</b>?`,
      diagramSVG: null,
      choices, correctAnswer: String(notFactor),
      explanation: `The factors of ${target} are: ${allFactors.join(', ')}.<br><b>${notFactor}</b> does not divide evenly into ${target}, so it is not a factor.`
    };
  }

  // squareNum
  const n = rnd(2, difficulty==='hard' ? 15 : 10);
  const correct = n*n;
  const choices = makeChoices(correct,
    [n*(n+1), (n-1)*(n-1), (n+1)*(n+1)],
    () => Math.max(1, correct + pick([-3,-2,-1,1,2,3]))
  );
  return {
    id: uid(), section:'multiplication', difficulty, type:'mcq',
    prompt: `What is the <b>${ordinal(n)}</b> square number?`,
    diagramSVG: null,
    choices, correctAnswer: String(correct),
    explanation: `The ${ordinal(n)} square number is ${n} × ${n} = <b>${correct}</b>.`
  };
}

/* ===================== QUESTION BANK: SECTION "division" ===================== */
function genDivisionQuestion(difficulty){
  const kind = pick(['remainder','ceiling','divisibility']);

  if (kind === 'remainder'){
    const divisor = rnd(4,9);
    const quotient = rnd(difficulty==='hard'?80:20, difficulty==='hard'?199:99);
    const remainder = rnd(1,divisor-1);
    const dividend = quotient*divisor + remainder;
    const correct = `${quotient} r ${remainder}`;
    const distractorSet = new Set([`${quotient} r ${Math.max(0,remainder-1)}`, `${quotient+1} r ${remainder}`, `${quotient} r ${(remainder+1)%divisor}`]);
    distractorSet.delete(correct);
    const choices = shuffle([correct, ...Array.from(distractorSet)].slice(0,4));
    return {
      id: uid(), section:'division', difficulty, type:'mcq',
      prompt: `Calculate <b>${dividend} ÷ ${divisor}</b>. Give your answer with a remainder.`,
      diagramSVG: null,
      choices, correctAnswer: correct,
      explanation: `${divisor} × ${quotient} = ${quotient*divisor}.<br>${dividend} − ${quotient*divisor} = ${remainder}.<br>So ${dividend} ÷ ${divisor} = <b>${correct}</b>.`
    };
  }

  if (kind === 'ceiling'){
    const perBox = rnd(4,9);
    const totalItems = rnd(perBox*5+1, perBox*20);
    const correct = Math.ceil(totalItems/perBox);
    const choices = makeChoices(correct,
      [Math.floor(totalItems/perBox), correct+1, correct-1],
      () => Math.max(1, correct + pick([-2,2,3,-3]))
    );
    const item = pick(['cupcakes','oranges','pencils','marbles']);
    return {
      id: uid(), section:'division', difficulty, type:'mcq',
      prompt: `Boxes hold <b>${perBox} ${item}</b> each. A baker makes <b>${totalItems} ${item}</b>. How many boxes are needed to hold all of them?`,
      diagramSVG: null,
      choices, correctAnswer: String(correct),
      explanation: `${totalItems} ÷ ${perBox} = ${fmt(totalItems/perBox)}.<br>Since there are some ${item} left over, one extra box is needed, so <b>${correct}</b> boxes are needed in total.`
    };
  }

  // divisibility
  const divisor = pick([3,4,6,8,9]);
  const base = rnd(100,800);
  const divisibleNum = base - (base % divisor);
  const choices = makeChoices(divisibleNum,
    [divisibleNum+1, divisibleNum+2, divisibleNum+5].filter(n => n % divisor !== 0),
    () => { const off = rnd(1,divisor-1); return divisibleNum + off + pick([0,divisor*rnd(1,3)]); }
  );
  return {
    id: uid(), section:'division', difficulty, type:'mcq',
    prompt: `Which of these numbers IS divisible by <b>${divisor}</b> (with no remainder)?`,
    diagramSVG: null,
    choices, correctAnswer: String(divisibleNum),
    explanation: `${divisibleNum} ÷ ${divisor} = ${divisibleNum/divisor} exactly, with no remainder, so ${divisibleNum} is divisible by ${divisor}. The other numbers leave a remainder when divided by ${divisor}.`
  };
}

function netSVG(cells){
  const cellSize = 34, pad = 10;
  const maxR = Math.max(...cells.map(c=>c[0]));
  const maxC = Math.max(...cells.map(c=>c[1]));
  const w = (maxC+1)*cellSize + pad*2, h = (maxR+1)*cellSize + pad*2;
  const rects = cells.map(([r,c]) => `<rect x="${pad+c*cellSize}" y="${pad+r*cellSize}" width="${cellSize}" height="${cellSize}" fill="#c9e8ff" stroke="#4361ee" stroke-width="2"/>`).join('');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${rects}</svg>`;
}

  {key:'multiplication',   name:'Multiplication',       emoji:'✖️', gen: genMultiplicationQuestion},
  {key:'division',         name:'Division',             emoji:'➗', gen: genDivisionQuestion}
];
// Topic-balanced draw: 50 questions total, roughly 3-4 per topic (sums to 50).
const DRAW_PLAN = {
  placeValue:3, rounding:3, triangularNumbers:3, time:3, fractions:4, laws:4,
  percentDecimals:4, trianglesTypes:3, shapes3d:4, shapes:4, dataHandling:3,
  angles:3, addition:3, multiplication:3, division:3
};
// Overall quiz-wide difficulty mix (not per-topic): 50 questions total.
const GLOBAL_DIFF_COUNTS = {hard:25, medium:10, easy:10, grade6:5};

function generateQuiz(){
  // Build a topic-balanced slot list (per DRAW_PLAN), shuffle it, then pair each
  // slot with a shuffled difficulty from GLOBAL_DIFF_COUNTS and generate a fresh,
  // randomised MCQ for it — so every attempt (and every restart) is a new set of 50.
  const topicSlots = [];
  Object.entries(DRAW_PLAN).forEach(([key,n]) => { for (let i=0;i<n;i++) topicSlots.push(key); });
  const diffSlots = [];
  Object.entries(GLOBAL_DIFF_COUNTS).forEach(([diff,n]) => { for (let i=0;i<n;i++) diffSlots.push(diff); });
  const shuffledTopics = shuffle(topicSlots);
  const shuffledDiffs = shuffle(diffSlots);
  return shuffledTopics.map((key,i) => {
    const sec = SECTIONS.find(s=>s.key===key);
    return sec.gen(shuffledDiffs[i]);
  });
}

function pushHistory(entry){ const h = getHistory(); h.unshift(entry); saveJSON(LS_HISTORY, h.slice(0,25)); }

function computeBadgesForAttempt(report){
  const badges = [];
  if (report.percent === 100) badges.push({e:'🏆', n:'Cum Laude'});
  else if (report.percent >= 90) badges.push({e:'🎖️', n:'Distinction'});
  else if (report.percent >= 75) badges.push({e:'⭐', n:'Merit'});
  report.sectionReports.forEach(sr => { if (sr.percent === 100) badges.push({e:'🌟', n: sr.name+' Master'}); });
  badges.push({e:'✅', n:'Completed'});
  return badges;
}

function renderBadgeShelf(history){
  if (history.length===0) return '<p>Complete a quiz to start earning badges!</p>';
  const all = [];
  history.forEach(h => (h.badges||[]).forEach(b => all.push(b)));
  const seen = new Set();
  const unique = all.filter(b => { const k=b.n; if (seen.has(k)) return false; seen.add(k); return true; });
  if (unique.length===0) return '<p>Complete a quiz to start earning badges!</p>';
  return unique.map(b => `<div class="badge-chip">${b.e}</div>`).join('');
}

function renderAnswerArea(q, existing){
  const answerArea = document.getElementById('answerArea');
  const feedbackArea = document.getElementById('feedbackArea');
  const memoArea = document.getElementById('memoArea');
  const resolved = existing && existing.resolved;

  if (q.type === 'mcq' || q.type === 'tf'){
    answerArea.innerHTML = `<div class="choices">${q.choices.map((c,i)=>{
      const letter = String.fromCharCode(65+i);
      let cls = 'choice-btn';
      if (resolved){
        if (c === q.correctAnswer) cls += ' correct';
        else if (existing.lastChosen === c) cls += ' incorrect';
        else cls += ' disabled-other';
      }
      return `<button class="${cls}" data-choice="${esc(c)}" ${resolved?'disabled':''}><span class="choice-letter">${letter}</span><span>${c}</span></button>`;
    }).join('')}</div>`;
    if (!resolved){
      answerArea.querySelectorAll('.choice-btn').forEach(btn => {
        btn.onclick = () => submitAnswer(q, btn.getAttribute('data-choice'));
      });
    }
  } else if (q.type === 'numeric'){
    answerArea.innerHTML = `<div class="numeric-row">
      <input type="number" id="numInput" placeholder="Type your answer" ${resolved?'disabled':''} value="${resolved?existing.lastChosen:''}" />
      <button class="btn-primary" id="submitNum" ${resolved?'disabled':''}>Submit</button>
    </div>`;
    if (!resolved){
      const submit = () => {
        const v = document.getElementById('numInput').value;
        if (v === '') return;
        submitAnswer(q, Number(v));
      };
      document.getElementById('submitNum').onclick = submit;
      document.getElementById('numInput').addEventListener('keydown', e => { if (e.key==='Enter') submit(); });
    }
  }

  if (existing){
    renderFeedback(q, existing, feedbackArea);
    if (resolved) renderMemo(q, memoArea);
  }
}

function renderFeedback(q, ans, container){
  if (!ans.lastWasCorrect && !ans.resolved){
    container.innerHTML = `<div class="feedback-banner incorrect">🤔 Not quite! Give it one more try.</div>`;
  } else if (ans.resolved && ans.correct){
    container.innerHTML = `<div class="feedback-banner correct">${ans.attempts===1 ? '🎉 Correct on the first try! Amazing!' : '✅ Correct! Well done for trying again.'}</div>`;
  } else if (ans.resolved && !ans.correct){
    container.innerHTML = `<div class="feedback-banner wrong-final">📚 Not this time — read the memo below to learn why.</div>`;
  } else {
    container.innerHTML = '';
  }
}

function renderMemo(q, container){
  container.innerHTML = `<div class="memo-box">
    <h4>📝 Study Memo</h4>
    <div class="ans-line">Correct answer: <b>${q.correctAnswer}</b></div>
    <div class="explain">${q.explanation}</div>
  </div>`;
}

function submitAnswer(q, chosenRaw){
  const existing = state.answers[q.id] || {attempts:0, resolved:false};
  existing.attempts += 1;
  existing.lastChosen = chosenRaw;
  const isCorrect = q.type === 'numeric'
    ? Number(chosenRaw) === Number(q.correctAnswer)
    : String(chosenRaw) === String(q.correctAnswer);

  if (isCorrect){
    existing.resolved = true;
    existing.correct = true;
    existing.lastWasCorrect = true;
    state.answers[q.id] = existing;
    saveJSON(LS_SAVE, state);
    launchConfetti(existing.attempts===1 ? 60 : 35);
    document.getElementById('qcard').style.animation = 'none';
  } else if (existing.attempts >= 1){
    existing.resolved = true;
    existing.correct = false;
    existing.lastWasCorrect = false;
    state.answers[q.id] = existing;
    saveJSON(LS_SAVE, state);
    const card = document.getElementById('qcard');
    card.classList.add('shake'); setTimeout(()=>card.classList.remove('shake'), 420);
  } else {
    existing.resolved = false;
    existing.lastWasCorrect = false;
    state.answers[q.id] = existing;
    saveJSON(LS_SAVE, state);
    const card = document.getElementById('qcard');
    card.classList.add('shake'); setTimeout(()=>card.classList.remove('shake'), 420);
  }
  renderQuiz();
}

function finishQuiz(){
  const total = totalCount();
  const correct = correctCount();
  const percent = Math.round((correct/total)*100);
  const noRetries = Object.values(state.answers).every(a => a.attempts === 1);
  const usedRetries = Object.values(state.answers).some(a => a.attempts > 1);

  const sectionReports = SECTIONS.map(sec => {
    const sq = sectionQuestions(sec.key);
    const sc = sectionCorrectCount(sec.key);
    return {key: sec.key, name: sec.name, emoji: sec.emoji, correct: sc, total: sq.length, percent: sq.length ? Math.round((sc/sq.length)*100) : 0};
  }).filter(sr => sr.total > 0);

  const report = {
    date: Date.now(), correct, total, percent, noRetries, usedRetries, sectionReports,
    questions: state.questions.map(q => ({
      prompt: q.prompt, section: q.section, difficulty: q.difficulty,
      chosen: state.answers[q.id] ? state.answers[q.id].lastChosen : null,
      correctAnswer: q.correctAnswer, wasCorrect: state.answers[q.id] ? !!state.answers[q.id].correct : false,
      explanation: q.explanation
    }))
  };
  report.badges = computeBadgesForAttempt(report);

  const xpEarned = Object.values(state.answers).reduce((s,a)=> s + (a.correct ? (a.attempts===1?10:5) : 0), 0);
  addXP(xpEarned);
  report.xpEarned = xpEarned;

  pushHistory({date: report.date, correct, total, percent, badges: report.badges});
  localStorage.removeItem(LS_SAVE);

  window._lastReport = report;
  go('results');
}

  <p><b>Date:</b> ${dateStr}<br/><b>Score:</b> ${report.correct}/${report.total} (${report.percent}%)<br/><b>Badges earned:</b> ${report.badges.map(b=>b.n).join(', ')}</p>
  <table><thead><tr><th>#</th><th>Topic</th><th>Question</th><th>Your Answer</th><th>Correct Answer</th><th>Result</th><th>Explanation / Memo</th></tr></thead>
  <tbody>${rows}</tbody></table>
  <p style="margin-top:20px;color:#6b7394">Generated by Maths Quest – keep practising and you'll master these in no time!</p>

  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `maths-quest-results-${new Date(report.date).toISOString().slice(0,10)}.html`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ===================== CONFETTI ===================== */
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
let confettiParticles = [];
let confettiRAF = null;
function launchConfetti(count){
  const colors = ['#6c63ff','#ff6b9d','#ffb703','#06d6a0','#4cc9f0','#ef476f'];
  for (let i=0;i<count;i++){
    confettiParticles.push({
      x: Math.random()*canvas.width, y: -20 - Math.random()*80,
      vx: (Math.random()-0.5)*3, vy: 2+Math.random()*3,
      size: 5+Math.random()*6, color: pick(colors), rot: Math.random()*360, vr:(Math.random()-0.5)*10,
      life: 0, maxLife: 140+Math.random()*60
    });
  }
  if (!confettiRAF) confettiLoop();
}
function confettiLoop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  confettiParticles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.rot += p.vr; p.life++;
    ctx.save();
    ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
    ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, 1 - p.life/p.maxLife);
    ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
    ctx.restore();
  });
  confettiParticles = confettiParticles.filter(p => p.life < p.maxLife && p.y < canvas.height+40);
  if (confettiParticles.length>0){
    confettiRAF = requestAnimationFrame(confettiLoop);
  } else {
    confettiRAF = null;
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }
}
