<style>
:root{
  --bg1:#fff7e6; --bg2:#fdeee0; --card:#ffffff; --ink:#3a2c1a; --muted:#8a7256;
  --purple:#c1780f; --pink:#b0413e; --gold:#e9c46a; --green:#588157; --blue:#457b9d; --red:#e63946;
  --shadow:0 14px 34px rgba(120,80,30,.14);
  --radius:22px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:"Baloo 2","Trebuchet MS","Segoe UI",Arial,sans-serif;color:var(--ink)}
body{
  background:
    radial-gradient(circle at 8% 10%, #ffe7b0 0, transparent 40%),
    radial-gradient(circle at 92% 15%, #ffd7c2 0, transparent 42%),
    radial-gradient(circle at 50% 100%, #e6d3ae 0, transparent 45%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  padding:14px; padding-bottom:40px;
}
.app{max-width:760px;margin:0 auto;display:grid;gap:14px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
h1,h2,h3{margin:0}
h1{font-size:clamp(1.4rem,5vw,2rem);line-height:1.1}
p{margin:0;color:var(--muted)}
button{border:none;border-radius:16px;padding:12px 16px;font-size:1rem;font-weight:800;cursor:pointer;
  transition:transform .12s ease, box-shadow .2s ease, opacity .2s ease; box-shadow:0 8px 18px rgba(120,80,30,.16);
  font-family:inherit;}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(1px) scale(.98)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn-primary{background:linear-gradient(135deg,var(--purple),#e0a339);color:#fff}
.btn-secondary{background:#fdf1dc;color:var(--ink)}
.btn-good{background:linear-gradient(135deg,var(--green),#7fae7c);color:#0c2a10}
.btn-warn{background:linear-gradient(135deg,var(--gold),#f4de9b);color:#5b3d00}
.btn-danger{background:linear-gradient(135deg,var(--red),#ff8fa3);color:#fff}
.btn-ghost{background:transparent;color:var(--purple);box-shadow:none;text-decoration:underline;padding:6px 8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.row.center{justify-content:center}
.pill{padding:7px 13px;border-radius:999px;background:#fdf1dc;font-weight:800;font-size:.85rem;display:inline-flex;gap:6px;align-items:center}
.pill.gold{background:#fff4d6;color:#6f5200}
.pill.green{background:#e4f2e2;color:#204d24}
.pill.pink{background:#fbe1de;color:#7a2420}
.badge-emoji{font-size:1.1em}

/* Home screen */
.hero{background:linear-gradient(135deg,var(--purple),#d9a441 60%, var(--pink));color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 90% -10%, rgba(255,255,255,.35), transparent 45%)}
.hero h1{color:#fff}
.hero p{color:rgba(255,255,255,.92)}
.level-box{background:rgba(255,255,255,.18);border-radius:16px;padding:10px 14px;backdrop-filter:blur(2px)}
.xp-bar-outer{height:12px;border-radius:999px;background:rgba(255,255,255,.28);overflow:hidden;margin-top:6px}
.xp-bar-inner{height:100%;background:linear-gradient(90deg,var(--gold),#fff3b0);border-radius:999px;transition:width .5s ease}
.switch-link{font-size:.8rem;color:rgba(255,255,255,.9);text-decoration:underline;font-weight:700;display:block}
.switch-links{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.topic-card{border-radius:18px;padding:12px;color:#fff;position:relative;overflow:hidden;min-height:80px;display:flex;flex-direction:column;justify-content:space-between;font-size:.88rem}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:14px;background:#fdf6ea;border:1px solid #f3e6cd;font-size:.92rem}
.history-item + .history-item{margin-top:8px}
.badges-shelf{display:flex;flex-wrap:wrap;gap:8px}
.badge-chip{background:#fff7e0;border:1px solid #ffe6a6;border-radius:14px;padding:8px 10px;font-size:1.4rem;position:relative}

/* Quiz screen */
.progress-wrap{display:grid;gap:8px}
.progress-label{display:flex;justify-content:space-between;font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.bar-outer{height:14px;border-radius:999px;background:#fdf1dc;overflow:hidden;box-shadow:inset 0 0 0 1px #f3e2bf}
.bar-inner{height:100%;border-radius:999px;transition:width .45s cubic-bezier(.4,1.6,.6,1)}
.bar-inner.overall{background:linear-gradient(90deg,var(--purple),var(--pink))}
.bar-inner.section{background:linear-gradient(90deg,var(--blue),var(--green))}
.score-strip{display:flex;gap:10px;flex-wrap:wrap}
.score-tile{flex:1;min-width:110px;background:#fdf6ea;border-radius:16px;padding:10px 12px;text-align:center;border:1px solid #f3e6cd}
.score-tile .num{font-size:1.35rem;font-weight:900}
.score-tile .lbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;font-weight:800;letter-spacing:.03em}

.qcard{padding:18px;display:grid;gap:16px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.difficulty-tag{font-size:.72rem;font-weight:900;text-transform:uppercase;padding:5px 10px;border-radius:999px;letter-spacing:.03em}
.difficulty-tag.easy{background:#e4f2e2;color:#204d24}
.difficulty-tag.medium{background:#fff4d6;color:#6f5200}
.difficulty-tag.hard{background:#fbe1de;color:#7a2420}
.qprompt{font-size:1.15rem;font-weight:800;line-height:1.5}
.choices{display:grid;gap:10px}
.choice-btn{text-align:left;background:#fdf6ea;border:2px solid #f3e6cd;color:var(--ink);font-weight:700;padding:13px 15px;border-radius:16px;box-shadow:none;display:flex;align-items:center;gap:10px}
.choice-btn:hover{border-color:#e6cfa0}
.choice-btn.selected{border-color:var(--purple);background:#fdf1dc}
.choice-btn.correct{border-color:var(--green);background:#e4f2e2;color:#204d24}
.choice-btn.incorrect{border-color:var(--red);background:#fbe1de;color:#7a2420}
.choice-btn.disabled-other{opacity:.55}
.choice-letter{width:26px;height:26px;border-radius:50%;background:#f3e6cd;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:900;flex:none}
.choice-btn.correct .choice-letter{background:var(--green);color:#fff}
.choice-btn.incorrect .choice-letter{background:var(--red);color:#fff}

.feedback-banner{border-radius:16px;padding:12px 14px;font-weight:800;display:flex;gap:10px;align-items:center;animation:pop .35s ease}
.feedback-banner.correct{background:#e4f2e2;color:#204d24}
.feedback-banner.incorrect{background:#fff1d6;color:#6f5200}
.feedback-banner.wrong-final{background:#fbe1de;color:#7a2420}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .4s ease}

.memo-box{background:#fdf6ea;border:2px dashed #e6cfa0;border-radius:18px;padding:14px 16px;display:grid;gap:8px}
.memo-box h4{margin:0;font-size:.95rem;color:var(--purple);display:flex;align-items:center;gap:6px}
.memo-box .ans-line{font-weight:800}
.memo-box .explain{color:var(--ink);line-height:1.5}

.nav-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.arrow-btn{width:52px;height:52px;border-radius:50%;font-size:1.3rem;display:flex;align-items:center;justify-content:center;background:#fdf1dc;color:var(--purple);box-shadow:0 6px 14px rgba(120,80,30,.14)}

.results-card{text-align:center;display:grid;gap:14px}
.big-score{font-size:3rem;font-weight:900;background:linear-gradient(135deg,var(--purple),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.stars-row{font-size:2rem;letter-spacing:4px}
.section-report{text-align:left;display:grid;gap:8px}
.section-report .sr-row{display:flex;justify-content:space-between;background:#fdf6ea;border-radius:14px;padding:10px 12px;border:1px solid #f3e6cd}

.hidden{display:none !important}
#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:999}

.tab-bar-wrap{max-width:760px;margin:0 auto 10px}
.tab-bar{display:flex;gap:6px;padding:7px;background:rgba(255,255,255,.92);border-radius:16px;box-shadow:0 6px 18px rgba(120,80,30,.12);overflow-x:auto}
.tab-btn{flex:1;text-align:center;padding:10px 6px;border-radius:12px;font-weight:800;font-size:.82rem;border:none;background:transparent;color:var(--muted);white-space:nowrap;font-family:inherit;cursor:pointer}
.tab-btn.active{background:var(--purple);color:#fff}
.footer-note{text-align:center;font-size:.78rem;color:var(--muted);padding-top:6px}
.install-banner{background:#fff7e0;border:1px solid #ffe6a6;border-radius:16px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
</style>
</head>

<script>
/* ===================== UTILITIES ===================== */
const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const pick = (arr) => arr[rnd(0, arr.length - 1)];
const uid = () => Math.random().toString(36).slice(2, 10);
function shuffle(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){const j=rnd(0,i); [a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ===================== FIXED QUESTION BANK: 50 Ancient Egypt questions ===================== */
const RAW_QUESTIONS = [
  // --- Egypt & the Nile (geography) ---
  {section:'geography', difficulty:'easy', type:'tf', prompt:'Ancient Egypt was one of the oldest civilisations in Africa.', correctAnswer:'True',
    explanation:'True. Ancient Egypt is one of the oldest civilisations in Africa, thriving for thousands of years.'},
  {section:'geography', difficulty:'easy', type:'mcq', prompt:'Which continent is Egypt located in?', choices:['Africa','Asia','Europe','South America'], correctAnswer:'Africa',
    explanation:'Egypt is situated in the continent of Africa.'},
  {section:'geography', difficulty:'easy', type:'tf', prompt:'The Nile is the longest river in Africa.', correctAnswer:'True',
    explanation:'True. The Nile is the longest river in Africa, and it was central to Ancient Egyptian life.'},
  {section:'geography', difficulty:'medium', type:'mcq', prompt:'Which sea does the Nile River flow into?', choices:['Mediterranean Sea','Red Sea','Atlantic Ocean','Indian Ocean'], correctAnswer:'Mediterranean Sea',
    explanation:'The Nile flows north into the Mediterranean Sea.'},
  {section:'geography', difficulty:'easy', type:'mcq', prompt:'What word describes a way of life where people learn different skills, have different jobs, and live together in an organised way?', choices:['Civilisation','Population','Colony','Kingdom'], correctAnswer:'Civilisation',
    explanation:'A civilisation is a way of life where people learn different skills, take on different jobs, and live together in an organised way.'},
  {section:'geography', difficulty:'medium', type:'tf', prompt:'The first people settled along the Nile only about 500 years ago.', correctAnswer:'False',
    explanation:'False. The first people settled along the northern banks of the Nile about 5,000 years ago.'},
  {section:'geography', difficulty:'medium', type:'mcq', prompt:'About how long ago did people first settle along the northern banks of the Nile?', choices:['5,000 years ago','500 years ago','50,000 years ago','5 years ago'], correctAnswer:'5,000 years ago',
    explanation:'The first people settled along the northern banks of the Nile about 5,000 years ago.'},
  {section:'geography', difficulty:'hard', type:'mcq', prompt:'Why did the first settlers choose to live along the banks of the Nile?', choices:['The soil there was very good for growing crops','The weather was cold','There were mountains for protection','It was far away from other people'], correctAnswer:'The soil there was very good for growing crops',
    explanation:'The soil along the river was very fertile, which was excellent for growing crops — this is why the first settlers chose to live there.'},

  // --- Importance of the Nile ---
  {section:'importance', difficulty:'easy', type:'mcq', prompt:'The Nile River was often described as the ___ of Ancient Egypt, because it gave life and strength.', choices:['life blood','backbone','heart','soul'], correctAnswer:'life blood',
    explanation:'The Nile was called the "life blood" of Ancient Egypt — something that gives life and strength.'},
  {section:'importance', difficulty:'medium', type:'mcq', prompt:'What nickname did the Ancient Greeks give to Egypt?', choices:['The gift of the Nile','The land of gold','The desert kingdom','The river empire'], correctAnswer:'The gift of the Nile',
    explanation:'The Greeks called Egypt "the gift of the Nile" because the river was so important to its success.'},
  {section:'importance', difficulty:'easy', type:'tf', prompt:'Ancient Egypt would never have been as successful without the Nile River.', correctAnswer:'True',
    explanation:'True. Without the Nile, Ancient Egypt would never have been as successful — it provided water, fertile soil, and transport.'},
  {section:'importance', difficulty:'medium', type:'mcq', prompt:'What is the name for the rich, dark soil the Nile left behind after it flooded?', choices:['Fertile silt (mud)','Sand','Clay','Limestone'], correctAnswer:'Fertile silt (mud)',
    explanation:'The Nile carried fertile silt (mud) that was left behind after flooding, which farmers used to grow their crops.'},
  {section:'importance', difficulty:'medium', type:'tf', prompt:'The Nile\'s yearly floods only caused problems and had no benefits for farmers.', correctAnswer:'False',
    explanation:'False. The floods left behind fertile soil, which was a big advantage for growing crops.'},
  {section:'importance', difficulty:'hard', type:'mcq', prompt:'What was one advantage of the Nile\'s yearly floods?', choices:['They left behind fertile soil for growing crops','They destroyed all the crops every year','They made the desert bigger','They stopped people travelling by boat'], correctAnswer:'They left behind fertile soil for growing crops',
    explanation:'The floods left behind rich, fertile soil, which was excellent for growing crops.'},
  {section:'importance', difficulty:'medium', type:'mcq', prompt:'What natural feature surrounding Egypt made it hard for enemies to invade or settle nearby?', choices:['The desert','The mountains','The ocean','The rainforest'], correctAnswer:'The desert',
    explanation:'The desert surrounding Egypt made it difficult for other settlements to develop nearby or for enemies to attack.'},
  {section:'importance', difficulty:'easy', type:'tf', prompt:'The Nile River provided the Ancient Egyptians with fertile soil and water for their crops.', correctAnswer:'True',
    explanation:'True. The Nile gave the Egyptians plenty of water and fertile soil for growing crops.'},

  // --- Uses of the Nile ---
  {section:'uses', difficulty:'easy', type:'mcq', prompt:'Which of these was NOT a way the Ancient Egyptians used the Nile River?', choices:['Space travel','Irrigation','Fishing','Transportation'], correctAnswer:'Space travel',
    explanation:'The Egyptians used the Nile for irrigation, fishing and transportation — not space travel, which did not exist yet!'},
  {section:'uses', difficulty:'easy', type:'mcq', prompt:'What device, using a pulley system, did the Egyptians invent to lift water from the river?', choices:['A shaduf','A chariot','A sundial','A papyrus press'], correctAnswer:'A shaduf',
    explanation:'The Egyptians invented the shaduf, a pulley system used to lift large buckets of water from the river.'},
  {section:'uses', difficulty:'medium', type:'tf', prompt:'The Egyptians used canals and shadufs to irrigate their crops.', correctAnswer:'True',
    explanation:'True. Farmers irrigated their crops using canals and shadufs.'},
  {section:'uses', difficulty:'medium', type:'mcq', prompt:'What plant, which grew along the riverbanks, was used to make paper and building materials?', choices:['Papyrus reeds','Bamboo','Cotton','Palm leaves'], correctAnswer:'Papyrus reeds',
    explanation:'Papyrus reeds, which grew along the river banks, were used for building materials and for making paper.'},
  {section:'uses', difficulty:'easy', type:'mcq', prompt:'What material, found along the Nile, was used to make bricks?', choices:['Mud','Steel','Glass','Plastic'], correctAnswer:'Mud',
    explanation:'Mud from along the Nile was used to make bricks for building.'},
  {section:'uses', difficulty:'medium', type:'mcq', prompt:'Which animals did the Egyptians hunt along the Nile for food?', choices:['Hippos and river birds','Lions and zebras','Penguins and seals','Kangaroos and koalas'], correctAnswer:'Hippos and river birds',
    explanation:'The Egyptians hunted hippos and river birds along the Nile for food.'},
  {section:'uses', difficulty:'easy', type:'tf', prompt:'The Nile River was used as a route for transporting goods and building materials.', correctAnswer:'True',
    explanation:'True. The Nile was the Egyptians\' main transport route for goods and materials.'},
  {section:'uses', difficulty:'medium', type:'mcq', prompt:'Which of these was a use of the Nile River for large settlements?', choices:['Providing drinking water','Providing electricity','Providing internet','Providing oil'], correctAnswer:'Providing drinking water',
    explanation:'The Nile provided drinking water for large settlements of people.'},
  {section:'uses', difficulty:'hard', type:'mcq', prompt:'Besides making paper, what else were papyrus reeds used for?', choices:['Building materials','Cooking fuel','Jewellery','Medicine'], correctAnswer:'Building materials',
    explanation:'Papyrus reeds were used both for making paper and as building materials.'},

  // --- Social Structure ---
  {section:'society', difficulty:'easy', type:'mcq', prompt:'What is the word for a society where people live according to different social classes?', choices:['Hierarchical','Democratic','Nomadic','Republic'], correctAnswer:'Hierarchical',
    explanation:'Ancient Egypt was a hierarchical society, meaning people lived according to their social class.'},
  {section:'society', difficulty:'easy', type:'mcq', prompt:'Who was at the very top of Ancient Egyptian society?', choices:['The Pharaoh','The Vizier','A scribe','A farmer'], correctAnswer:'The Pharaoh',
    explanation:'The Pharaoh (king) was at the top of the Ancient Egyptian social system.'},
  {section:'society', difficulty:'medium', type:'mcq', prompt:'Who was the Pharaoh\'s most senior advisor, ranked just below him?', choices:['The Vizier','A scribe','A craftsman','A farmer'], correctAnswer:'The Vizier',
    explanation:'The Vizier was the Pharaoh\'s chief minister and most senior advisor.'},
  {section:'society', difficulty:'medium', type:'tf', prompt:'Many Pharaohs were worshipped as gods.', correctAnswer:'True',
    explanation:'True. Many Pharaohs held great power and were worshipped as gods.'},
  {section:'society', difficulty:'easy', type:'mcq', prompt:'What was a person called whose job was to read and write important documents?', choices:['A scribe','A pharaoh','A farmer','A slave'], correctAnswer:'A scribe',
    explanation:'A scribe was a skilled writer whose job was to write down important things.'},
  {section:'society', difficulty:'medium', type:'mcq', prompt:'Why do we know so much about Ancient Egypt today?', choices:['Because scribes wrote things down','Because everyone could read and write','Because there were no written records at all','Because farmers kept diaries'], correctAnswer:'Because scribes wrote things down',
    explanation:'It is because of the work of scribes, who could read and write, that we know so much about Ancient Egypt today.'},
  {section:'society', difficulty:'medium', type:'mcq', prompt:'What job did administrators do in Ancient Egypt?', choices:['Measured land and collected taxes','Built pyramids alone','Fought in wars only','Cooked food for the pharaoh'], correctAnswer:'Measured land and collected taxes',
    explanation:'Administrators measured land and collected taxes for the Pharaoh, travelling up and down the Nile by boat.'},
  {section:'society', difficulty:'hard', type:'mcq', prompt:'How did farmers usually pay their taxes to the Pharaoh?', choices:['In crops or animals','In gold coins','In paper money','In jewellery only'], correctAnswer:'In crops or animals',
    explanation:'Farmers had to pay taxes to the Pharaoh in the form of crops or animals, according to the size of their farm.'},
  {section:'society', difficulty:'medium', type:'tf', prompt:'It is thought that slaves, who were at the bottom of society, helped build the pyramids of Giza.', correctAnswer:'True',
    explanation:'True. Slaves were at the very bottom of the hierarchy, and it is thought that they built the ancient pyramids of Giza.'},

  // --- Homes & Buildings ---
  {section:'homes', difficulty:'easy', type:'mcq', prompt:'What shape were the roofs of most Ancient Egyptian houses?', choices:['Flat','Pointed','Domed','Curved'], correctAnswer:'Flat',
    explanation:'The Egyptians built flat-roofed houses.'},
  {section:'homes', difficulty:'medium', type:'mcq', prompt:'What were most Ancient Egyptian houses built from?', choices:['Mud bricks baked hard in the sun','Steel beams','Glass panels','Wooden logs only'], correctAnswer:'Mud bricks baked hard in the sun',
    explanation:'Houses were built from bricks made of mud, which was baked hard under the sun.'},
  {section:'homes', difficulty:'medium', type:'tf', prompt:'Stone was mainly used to build ordinary Ancient Egyptian houses.', correctAnswer:'False',
    explanation:'False. Stone was only used to build tombs, palaces and temples — not ordinary houses.'},
  {section:'homes', difficulty:'medium', type:'mcq', prompt:'What was stone mainly used to build in Ancient Egypt?', choices:['Tombs, palaces and temples','Ordinary houses','Roads only','Boats only'], correctAnswer:'Tombs, palaces and temples',
    explanation:'Stone was only used to build tombs, palaces and temples.'},
  {section:'homes', difficulty:'easy', type:'tf', prompt:'Egyptian houses were built just above the flood water mark.', correctAnswer:'True',
    explanation:'True. Just above the flood water mark, the Egyptians built flat-roofed houses.'},
  {section:'homes', difficulty:'hard', type:'mcq', prompt:'What tool, using a pulley system, helped Egyptians lift water for building and farming?', choices:['The shaduf','The plough','The chariot','The sundial'], correctAnswer:'The shaduf',
    explanation:'The shaduf was a pulley system invented by the Egyptians to lift large buckets of water from the river.'},
  {section:'homes', difficulty:'medium', type:'tf', prompt:'Ancient Egyptians built their houses far away from the Nile River, deep in the desert.', correctAnswer:'False',
    explanation:'False. Egyptians built their houses near the Nile, just above the flood water mark, not deep in the desert.'},

  // --- Farming & Food ---
  {section:'farming', difficulty:'easy', type:'mcq', prompt:'What type of grain did the Ancient Egyptians grow to make bread and beer?', choices:['Barley','Rice','Corn','Oats'], correctAnswer:'Barley',
    explanation:'The Egyptians grew a type of grain called barley, which they used to make bread and beer.'},
  {section:'farming', difficulty:'easy', type:'tf', prompt:'The Egyptians made both bread and beer from barley.', correctAnswer:'True',
    explanation:'True. Barley was used to make both bread and beer.'},
  {section:'farming', difficulty:'medium', type:'mcq', prompt:'Which of these fruits did the Ancient Egyptians grow?', choices:['Melons and grapes','Bananas and pineapples','Apples and oranges','Coconuts and mangoes'], correctAnswer:'Melons and grapes',
    explanation:'The Egyptians grew fruits such as melons and grapes, among others.'},
  {section:'farming', difficulty:'medium', type:'mcq', prompt:'Which vegetables did the Ancient Egyptians grow?', choices:['Onions, cabbages, leeks and beans','Potatoes and corn','Carrots and peas only','Tomatoes and peppers'], correctAnswer:'Onions, cabbages, leeks and beans',
    explanation:'The Egyptians grew vegetables such as onions, cabbages, leeks and beans.'},
  {section:'farming', difficulty:'medium', type:'mcq', prompt:'What did the Ancient Egyptians turn grapes into?', choices:['Wine','Vinegar','Juice','Jam'], correctAnswer:'Wine',
    explanation:'The Egyptians turned grapes into wine.'},
  {section:'farming', difficulty:'medium', type:'mcq', prompt:'What plant did the Egyptians grow and turn into linen?', choices:['Flax','Cotton','Papyrus','Wool'], correctAnswer:'Flax',
    explanation:'Flax was a plant the Egyptians grew and made into linen cloth.'},
  {section:'farming', difficulty:'easy', type:'tf', prompt:'Flax was a plant that Egyptians turned into linen cloth.', correctAnswer:'True',
    explanation:'True. Flax was made into linen.'},
  {section:'farming', difficulty:'hard', type:'mcq', prompt:'Why was farming so successful in Ancient Egypt?', choices:['The Nile\'s floods left fertile soil for growing crops','There was no sunlight so crops grew slowly','The desert sand was perfect for crops','Egyptians imported all their food'], correctAnswer:'The Nile\'s floods left fertile soil for growing crops',
    explanation:'The Nile\'s yearly floods left behind fertile soil, which made farming very successful.'},
  {section:'farming', difficulty:'easy', type:'mcq', prompt:'Besides bread, what drink did the Egyptians make from barley?', choices:['Beer','Coffee','Tea','Milk'], correctAnswer:'Beer',
    explanation:'The Egyptians made both bread and beer from barley.'}
];

/* ===================== QUIZ GENERATION ===================== */
const SECTIONS = [
  {key:'geography', name:'Egypt &amp; the Nile', emoji:'🌍', color:'linear-gradient(135deg,#457b9d,#1d3557)'},
  {key:'importance', name:'Importance of the Nile', emoji:'💧', color:'linear-gradient(135deg,#48cae4,#0077b6)'},
  {key:'uses', name:'Uses of the Nile', emoji:'🚣', color:'linear-gradient(135deg,#588157,#3a5a40)'},
  {key:'society', name:'Social Structure', emoji:'👑', color:'linear-gradient(135deg,#e9c46a,#c1780f)'},
  {key:'homes', name:'Homes &amp; Buildings', emoji:'🏠', color:'linear-gradient(135deg,#b0413e,#7a2420)'},
  {key:'farming', name:'Farming &amp; Food', emoji:'🌾', color:'linear-gradient(135deg,#dda15e,#bc6c25)'}
];

function generateQuiz(){
  return shuffle(RAW_QUESTIONS).map(q => {
    const question = { ...q, id: uid() };
    if (question.type === 'mcq'){
      question.choices = shuffle(question.choices);
    } else {
      question.choices = ['True','False'];
    }
    return question;
  });
}
function sectionNameByKey(key){ const s = SECTIONS.find(x=>x.key===key); return s ? s.name.replace(/&amp;/g,'&') : key; }

/* ===================== PERSISTENCE ===================== */
const LS_SAVE = 'hq_saved_v1';
const LS_HISTORY = 'hq_history_v1';
const LS_XP = 'hq_xp_v1';

function loadJSON(key, fallback){
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch(e){ return fallback; }
}
function saveJSON(key, val){ try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }

function getXP(){ return loadJSON(LS_XP, {xp:0}); }
function addXP(n){ const d = getXP(); d.xp += n; saveJSON(LS_XP, d); return d.xp; }
function levelFromXP(xp){ return Math.floor(xp/100) + 1; }
function xpIntoLevel(xp){ return xp % 100; }

function getHistory(){ return loadJSON(LS_HISTORY, []); }
function pushHistory(entry){ const h = getHistory(); h.unshift(entry); saveJSON(LS_HISTORY, h.slice(0,25)); }

/* ===================== APP STATE ===================== */
let state = null;

function newQuizState(){
  return {
    startedAt: Date.now(),
    questions: generateQuiz(),
    index: 0,
    answers: {},
  };
}

function totalCount(){ return state.questions.length; }
function answeredCount(){ return Object.values(state.answers).filter(a=>a.resolved).length; }
function correctCount(){ return Object.values(state.answers).filter(a=>a.resolved && a.correct).length; }
function sectionQuestions(sectionKey){ return state.questions.filter(q=>q.section===sectionKey); }
function sectionAnsweredCount(sectionKey){ return sectionQuestions(sectionKey).filter(q=>state.answers[q.id] && state.answers[q.id].resolved).length; }
function sectionCorrectCount(sectionKey){ return sectionQuestions(sectionKey).filter(q=>state.answers[q.id] && state.answers[q.id].resolved && state.answers[q.id].correct).length; }

/* ===================== RENDERING ===================== */
const app = document.getElementById('app');

function go(view){ window.location.hash = view; render(); }

function render(){
  const hash = window.location.hash.replace('#','') || 'home';
  if (hash === 'home') return renderHome();
  if (hash === 'quiz') return renderQuiz();
  if (hash === 'results') return renderResults();
  renderHome();
}
window.addEventListener('hashchange', render);

function renderHome(){
  const saved = loadJSON(LS_SAVE, null);
  const history = getHistory();
  const xpData = getXP();
  const level = levelFromXP(xpData.xp);
  const pct = xpIntoLevel(xpData.xp);

  app.innerHTML = `
    <div class="card hero">
      <div class="row between">
        <div>
          <h1>🏺 History Quest</h1>
          <p>Ancient Egypt &middot; 50 Questions</p>
        </div>
        <div class="level-box">
          <div class="row" style="gap:6px"><span style="font-weight:900">Level ${level}</span> <span style="opacity:.85">⭐</span></div>
          <div class="xp-bar-outer"><div class="xp-bar-inner" style="width:${pct}%"></div></div>
          <div style="font-size:.72rem;opacity:.85;margin-top:2px">${pct}/100 XP to next level</div>
        </div>
      </div>
    </div>

    ${saved ? `
    <div class="card install-banner">
      <div><b>⏸️ You have a saved quiz in progress</b><br><span style="font-size:.85rem;color:var(--muted)">Question ${saved.index+1} of ${saved.questions.length}</span></div>
      <div class="row">
        <button class="btn-primary" id="continueBtn">Continue ▶</button>
        <button class="btn-ghost" id="discardBtn">Discard</button>
      </div>
    </div>` : ''}

    <div class="card">
      <h3 style="margin-bottom:10px">Start a fresh quiz</h3>
      <p style="margin-bottom:12px">50 questions about Ancient Egypt, freshly shuffled every time — mixed easy, medium and hard!</p>
      <div class="topic-grid">
        ${SECTIONS.map(s => `<div class="topic-card" style="background:${s.color}"><b>${s.emoji} ${s.name}</b></div>`).join('')}
      </div>
      <div class="row center" style="margin-top:14px">
        <button class="btn-primary" id="startBtn" style="font-size:1.1rem;padding:14px 28px">🚀 Start New Quiz</button>
      </div>
    </div>

    <div class="card">
      <h3>🏆 Your Badges</h3>
      <div class="badges-shelf" style="margin-top:12px">
        ${renderBadgeShelf(history)}
      </div>
    </div>

    <div class="card">
      <h3>📊 Your Past Attempts</h3>
      <div style="margin-top:12px">
      ${history.length===0 ? '<p>No attempts yet — play your first quiz!</p>' : history.slice(0,8).map(h => `
        <div class="history-item">
          <span>${new Date(h.date).toLocaleDateString()} ${new Date(h.date).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>
          <span class="pill ${h.percent>=90?'gold':h.percent>=70?'green':'pink'}">${h.correct}/${h.total} · ${h.percent}%</span>
        </div>`).join('')}
      </div>
    </div>
    <div class="footer-note">Works offline · Install this app to your home screen for the best experience · Made for a future archaeologist 🏺</div>
  `;

  document.getElementById('startBtn').onclick = () => {
    state = newQuizState();
    saveJSON(LS_SAVE, state);
    go('quiz');
  };
  const cbtn = document.getElementById('continueBtn');
  if (cbtn) cbtn.onclick = () => { state = saved; go('quiz'); };
  const dbtn = document.getElementById('discardBtn');
  if (dbtn) dbtn.onclick = () => { localStorage.removeItem(LS_SAVE); render(); };
}

function computeBadgesForAttempt(report){
  const badges = [];
  if (report.percent === 100) badges.push({e:'🏆', n:'Cum Laude'});
  else if (report.percent >= 90) badges.push({e:'🎖️', n:'Distinction'});
  else if (report.percent >= 75) badges.push({e:'⭐', n:'Merit'});
  if (report.noRetries) badges.push({e:'🎯', n:'Sharp Shooter'});
  if (report.usedRetries && report.percent >= 60) badges.push({e:'💪', n:'Comeback Kid'});
  report.sectionReports.forEach(sr => { if (sr.percent === 100) badges.push({e:'🌟', n: sr.name+' Master'}); });
  badges.push({e:'✅', n:'Completed'});
  return badges;
}

function renderBadgeShelf(history){
  if (history.length===0) return '<p>Complete a quiz to start earning badges!</p>';
  const all = [];
  history.forEach(h => (h.badges||[]).forEach(b => all.push(b)));
  const seen = new Set();
  const unique = all.filter(b => { const k=b.n; if (seen.has(k)) return false; seen.add(k); return true; });
  if (unique.length===0) return '<p>Complete a quiz to start earning badges!</p>';
  return unique.map(b => `<div class="badge-chip">${b.e}</div>`).join('');
}

function renderQuiz(){
  if (!state){ go('home'); return; }
  const q = state.questions[state.index];
  const total = totalCount();
  const answered = answeredCount();
  const correct = correctCount();
  const percent = answered ? Math.round((correct/answered)*100) : 0;
  const sec = SECTIONS.find(s=>s.key===q.section);
  const secTotal = sectionQuestions(q.section).length;
  const secAnswered = sectionAnsweredCount(q.section);

  const existing = state.answers[q.id];
  const resolved = existing && existing.resolved;

  app.innerHTML = `
    <div class="card progress-wrap">
      <div class="row between">
        <div class="progress-label">Overall Progress</div>
        <div class="progress-label">${answered}/${total}</div>
      </div>
      <div class="bar-outer"><div class="bar-inner overall" style="width:${(answered/total)*100}%"></div></div>
      <div class="row between" style="margin-top:4px">
        <div class="progress-label">${sec.emoji} ${sectionNameByKey(sec.key)}</div>
        <div class="progress-label">${secAnswered}/${secTotal}</div>
      </div>
      <div class="bar-outer"><div class="bar-inner section" style="width:${(secAnswered/secTotal)*100}%"></div></div>
      <div class="score-strip" style="margin-top:6px">
        <div class="score-tile"><div class="num">${correct}/${answered||0}</div><div class="lbl">Score</div></div>
        <div class="score-tile"><div class="num">${percent}%</div><div class="lbl">Accuracy</div></div>
        <div class="score-tile"><div class="num">${state.index+1}/${total}</div><div class="lbl">Question</div></div>
      </div>
    </div>

    <div class="card qcard" id="qcard">
      <div class="qtop">
        <span class="difficulty-tag ${q.difficulty}">${q.difficulty}</span>
        <span class="pill">${sec.emoji} ${sectionNameByKey(sec.key)}</span>
      </div>
      <div class="qprompt">${q.prompt}</div>
      <div id="answerArea"></div>
      <div id="feedbackArea"></div>
      <div id="memoArea"></div>
      <div class="nav-row">
        <button class="arrow-btn" id="backBtn" ${state.index===0 ? 'disabled':''}>←</button>
        <button class="btn-secondary" id="saveExitBtn">💾 Save &amp; Exit</button>
        <button class="arrow-btn" id="fwdBtn" ${resolved ? '' : 'disabled'}>→</button>
      </div>
    </div>
  `;

  renderAnswerArea(q, existing);

  document.getElementById('backBtn').onclick = () => { state.index = Math.max(0, state.index-1); saveJSON(LS_SAVE, state); render(); };
  document.getElementById('fwdBtn').onclick = () => {
    if (state.index === total-1){ finishQuiz(); return; }
    state.index++; saveJSON(LS_SAVE, state); render();
  };
  document.getElementById('saveExitBtn').onclick = () => { saveJSON(LS_SAVE, state); go('home'); };
}

function renderAnswerArea(q, existing){
  const answerArea = document.getElementById('answerArea');
  const feedbackArea = document.getElementById('feedbackArea');
  const memoArea = document.getElementById('memoArea');
  const resolved = existing && existing.resolved;

  answerArea.innerHTML = `<div class="choices">${q.choices.map((c,i)=>{
    const letter = String.fromCharCode(65+i);
    let cls = 'choice-btn';
    if (resolved){
      if (c === q.correctAnswer) cls += ' correct';
      else if (existing.lastChosen === c) cls += ' incorrect';
      else cls += ' disabled-other';
    }
    return `<button class="${cls}" data-choice="${esc(c)}" ${resolved?'disabled':''}><span class="choice-letter">${letter}</span><span>${c}</span></button>`;
  }).join('')}</div>`;
  if (!resolved){
    answerArea.querySelectorAll('.choice-btn').forEach(btn => {
      btn.onclick = () => submitAnswer(q, btn.getAttribute('data-choice'));
    });
  }

  if (existing){
    renderFeedback(q, existing, feedbackArea);
    if (resolved) renderMemo(q, memoArea);
  }
}

function renderFeedback(q, ans, container){
  if (!ans.lastWasCorrect && !ans.resolved){
    container.innerHTML = `<div class="feedback-banner incorrect">🤔 Not quite! Give it one more try.</div>`;
  } else if (ans.resolved && ans.correct){
    container.innerHTML = `<div class="feedback-banner correct">${ans.attempts===1 ? '🎉 Correct on the first try! Amazing!' : '✅ Correct! Well done for trying again.'}</div>`;
  } else if (ans.resolved && !ans.correct){
    container.innerHTML = `<div class="feedback-banner wrong-final">📚 Not this time — read the memo below to learn why.</div>`;
  } else {
    container.innerHTML = '';
  }
}

function renderMemo(q, container){
  container.innerHTML = `<div class="memo-box">
    <h4>📝 Study Memo</h4>
    <div class="ans-line">Correct answer: <b>${q.correctAnswer}</b></div>
    <div class="explain">${q.explanation}</div>
  </div>`;
}

function submitAnswer(q, chosenRaw){
  const existing = state.answers[q.id] || {attempts:0, resolved:false};
  existing.attempts += 1;
  existing.lastChosen = chosenRaw;
  const isCorrect = String(chosenRaw) === String(q.correctAnswer);

  if (isCorrect){
    existing.resolved = true;
    existing.correct = true;
    existing.lastWasCorrect = true;
    state.answers[q.id] = existing;
    saveJSON(LS_SAVE, state);
    launchConfetti(existing.attempts===1 ? 60 : 35);
  } else if (existing.attempts >= 2){
    existing.resolved = true;
    existing.correct = false;
    existing.lastWasCorrect = false;
    state.answers[q.id] = existing;
    saveJSON(LS_SAVE, state);
    const card = document.getElementById('qcard');
    card.classList.add('shake'); setTimeout(()=>card.classList.remove('shake'), 420);
  } else {
    existing.resolved = false;
    existing.lastWasCorrect = false;
    state.answers[q.id] = existing;
    saveJSON(LS_SAVE, state);
    const card = document.getElementById('qcard');
    card.classList.add('shake'); setTimeout(()=>card.classList.remove('shake'), 420);
  }
  renderQuiz();
}

function finishQuiz(){
  const total = totalCount();
  const correct = correctCount();
  const percent = Math.round((correct/total)*100);
  const noRetries = Object.values(state.answers).every(a => a.attempts === 1);
  const usedRetries = Object.values(state.answers).some(a => a.attempts > 1);

  const sectionReports = SECTIONS.map(sec => {
    const sq = sectionQuestions(sec.key);
    const sc = sectionCorrectCount(sec.key);
    return {key: sec.key, name: sectionNameByKey(sec.key), emoji: sec.emoji, correct: sc, total: sq.length, percent: Math.round((sc/sq.length)*100)};
  });

  const report = {
    date: Date.now(), correct, total, percent, noRetries, usedRetries, sectionReports,
    questions: state.questions.map(q => ({
      prompt: q.prompt, section: q.section, difficulty: q.difficulty,
      chosen: state.answers[q.id] ? state.answers[q.id].lastChosen : null,
      correctAnswer: q.correctAnswer, wasCorrect: state.answers[q.id] ? !!state.answers[q.id].correct : false,
      explanation: q.explanation
    }))
  };
  report.badges = computeBadgesForAttempt(report);

  const xpEarned = Object.values(state.answers).reduce((s,a)=> s + (a.correct ? (a.attempts===1?10:5) : 0), 0);
  addXP(xpEarned);
  report.xpEarned = xpEarned;

  pushHistory({date: report.date, correct, total, percent, badges: report.badges});
  localStorage.removeItem(LS_SAVE);

  window._lastReport = report;
  go('results');
}

function renderResults(){
  const report = window._lastReport;
  if (!report){ go('home'); return; }
  const stars = report.percent >= 90 ? '⭐⭐⭐' : report.percent >= 70 ? '⭐⭐' : report.percent >= 40 ? '⭐' : '🌱';

  app.innerHTML = `
    <div class="card results-card">
      <h1>${report.percent === 100 ? '🏆 Cum Laude!' : report.percent >= 75 ? '🎉 Great Job!' : '💪 Keep Practising!'}</h1>
      <div class="big-score">${report.correct}/${report.total}</div>
      <div style="font-size:1.2rem;font-weight:800">${report.percent}% · +${report.xpEarned} XP</div>
      <div class="stars-row">${stars}</div>
      <div class="badges-shelf row center">${report.badges.map(b=>`<div class="badge-chip">${b.e}</div>`).join('')}</div>
      <div class="section-report">
        ${report.sectionReports.map(sr => `<div class="sr-row"><span>${sr.emoji} ${sr.name}</span><b>${sr.correct}/${sr.total} (${sr.percent}%)</b></div>`).join('')}
      </div>
      <div class="row center">
        <button class="btn-primary" id="downloadBtn">⬇️ Download Summary</button>
        <button class="btn-good" id="playAgainBtn">🔄 New Quiz</button>
        <button class="btn-secondary" id="homeBtn">🏠 Home</button>
      </div>
    </div>
  `;
  if (report.percent >= 90) launchConfetti(140);

  document.getElementById('downloadBtn').onclick = () => downloadSummary(report);
  document.getElementById('playAgainBtn').onclick = () => { state = newQuizState(); saveJSON(LS_SAVE, state); go('quiz'); };
  document.getElementById('homeBtn').onclick = () => go('home');
}

function downloadSummary(report){
  const dateStr = new Date(report.date).toLocaleString();
  const rows = report.questions.map((q,i) => `
    <tr>
      <td style="padding:8px;border:1px solid #ddd">${i+1}</td>
      <td style="padding:8px;border:1px solid #ddd">${sectionNameByKey(q.section)} (${q.difficulty})</td>
      <td style="padding:8px;border:1px solid #ddd">${q.prompt}</td>
      <td style="padding:8px;border:1px solid #ddd">${q.chosen===null?'<i>no answer</i>':q.chosen}</td>
      <td style="padding:8px;border:1px solid #ddd">${q.correctAnswer}</td>
      <td style="padding:8px;border:1px solid #ddd;font-weight:bold;color:${q.wasCorrect?'#204d24':'#7a2420'}">${q.wasCorrect?'Correct':'Incorrect'}</td>
      <td style="padding:8px;border:1px solid #ddd">${q.explanation}</td>
    </tr>`).join('');
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>History Quest Results – ${dateStr}</title>
  <style>body{font-family:Arial,sans-serif;padding:20px;color:#3a2c1a}h1{color:#b8860b}table{border-collapse:collapse;width:100%;font-size:14px}th{background:#fdf1dc;padding:8px;border:1px solid #ddd;text-align:left}</style>
  </head><body>
  <h1>🏺 History Quest – Results</h1>
  <p><b>Date:</b> ${dateStr}<br/><b>Score:</b> ${report.correct}/${report.total} (${report.percent}%)<br/><b>Badges earned:</b> ${report.badges.map(b=>b.n).join(', ')}</p>
  <table><thead><tr><th>#</th><th>Topic</th><th>Question</th><th>Your Answer</th><th>Correct Answer</th><th>Result</th><th>Explanation / Memo</th></tr></thead>
  <tbody>${rows}</tbody></table>
  <p style="margin-top:20px;color:#8a7256">Generated by History Quest – keep exploring Ancient Egypt!</p>
  </body></html>`;
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `history-quest-results-${new Date(report.date).toISOString().slice(0,10)}.html`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ===================== CONFETTI ===================== */
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
let confettiParticles = [];
let confettiRAF = null;
function launchConfetti(count){
  const colors = ['#b8860b','#e9c46a','#b0413e','#588157','#457b9d','#dda15e'];
  for (let i=0;i<count;i++){
    confettiParticles.push({
      x: Math.random()*canvas.width, y: -20 - Math.random()*80,
      vx: (Math.random()-0.5)*3, vy: 2+Math.random()*3,
      size: 5+Math.random()*6, color: pick(colors), rot: Math.random()*360, vr:(Math.random()-0.5)*10,
      life: 0, maxLife: 140+Math.random()*60
    });
  }
  if (!confettiRAF) confettiLoop();
}
function confettiLoop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  confettiParticles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.rot += p.vr; p.life++;
    ctx.save();
    ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
    ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, 1 - p.life/p.maxLife);
    ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
    ctx.restore();
  });
  confettiParticles = confettiParticles.filter(p => p.life < p.maxLife && p.y < canvas.height+40);
  if (confettiParticles.length>0){
    confettiRAF = requestAnimationFrame(confettiLoop);
  } else {
    confettiRAF = null;
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }
}

/* ===================== SERVICE WORKER ===================== */
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

/* ===================== INIT ===================== */
render();
