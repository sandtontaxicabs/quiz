.results-card{text-align:center;display:grid;gap:14px}

.section-report{text-align:left;display:grid;gap:8px}
.section-report .sr-row{display:flex;justify-content:space-between;background:#f5f8ff;border-radius:14px;padding:10px 12px;border:1px solid #e3eaff}

</style>

<script>
/* ===================== UTILITIES ===================== */
const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const pick = (arr) => arr[rnd(0, arr.length - 1)];
const uid = () => Math.random().toString(36).slice(2, 10);
function shuffle(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){const j=rnd(0,i); [a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

/* ===================== FIXED QUESTION BANK: Grade 5 End-of-Year Exam Scope =====================
   Scope: Label parts of a flower / Seed dispersal, Sound, States of matter,
   Digestive system (Human digestive system), Forces, Seasons and adaptations
   of plants and animals. */
const RAW_QUESTIONS = [
  // --- Plant Reproduction: flower parts, pollination, seed dispersal, germination (16) ---
  {section:'reproduction', difficulty:'easy', type:'mcq', prompt:'What is pollination?', choices:['The transfer of pollen from the anther to the stigma of a flower of the same kind','The joining of pollen and an egg inside the ovary','The spreading of seeds away from the parent plant','The growth of a seed into a new plant'], correctAnswer:'The transfer of pollen from the anther to the stigma of a flower of the same kind',
    explanation:'Pollination is the transfer of pollen from the anther of one flower to the stigma of a flower of the same kind, carried out by insects or by wind.'},
  {section:'reproduction', difficulty:'easy', type:'mcq', prompt:'Which substance do insects and wind move from flower to flower during pollination?', choices:['Pollen','Nectar','Sepals','Seeds'], correctAnswer:'Pollen',
    explanation:'During pollination, insects and wind move pollen from the anther of one flower to the stigma of another flower of the same kind.'},
  {section:'reproduction', difficulty:'easy', type:'mcq', prompt:'Which part of the flower forms the fruit after fertilisation?', choices:['The ovary','The petal','The sepal','The stigma'], correctAnswer:'The ovary',
    explanation:'The ovary is the reproductive part of the flower that forms the fruit once fertilisation has taken place.'},
  {section:'reproduction', difficulty:'medium', type:'mcq', prompt:'Which part of the flower makes the pollen?', choices:['The anther','The stigma','The ovary','The sepal'], correctAnswer:'The anther',
    explanation:'The anther (at the top of the stamen) is the part of the flower that makes pollen.'},
  {section:'reproduction', difficulty:'medium', type:'mcq', prompt:'Which part of the flower receives pollen during pollination?', choices:['The stigma','The anther','The filament','The ovule'], correctAnswer:'The stigma',
    explanation:'The stigma is the sticky part at the top of the pistil that receives pollen during pollination.'},
  {section:'reproduction', difficulty:'easy', type:'mcq', prompt:'What are sepals?', choices:['Little green leaves that protect the flower bud','The brightly coloured parts that attract insects','The part of the flower that makes pollen','The part of the flower that receives pollen'], correctAnswer:'Little green leaves that protect the flower bud',
    explanation:'Sepals are the little green leaves that protect the flower bud before it opens.'},
  {section:'reproduction', difficulty:'easy', type:'mcq', prompt:'What are petals?', choices:['The brightly coloured part of a flower that attracts insects','The little green leaves that protect the flower bud','The part of the flower that makes pollen','The part of the flower that forms the fruit'], correctAnswer:'The brightly coloured part of a flower that attracts insects',
    explanation:'Petals are the brightly coloured part of a flower, and their job is to attract insects to the flower.'},
  {section:'reproduction', difficulty:'easy', type:'mcq', prompt:'What is nectar?', choices:['A sweet liquid that flowers produce to attract insects','The dust-like substance that fertilises a flower','The green leaves that protect a flower bud','The part of a flower that becomes a fruit'], correctAnswer:'A sweet liquid that flowers produce to attract insects',
    explanation:'Nectar is a sweet liquid which flowers produce to attract insects, who then help pollinate the flower.'},
  {section:'reproduction', difficulty:'medium', type:'mcq', prompt:'What is fertilisation?', choices:['When pollen and an egg join together inside the ovary','When pollen moves from the anther to the stigma','When a seed is carried away from the parent plant','When a seed starts to grow'], correctAnswer:'When pollen and an egg join together inside the ovary',
    explanation:'Fertilisation is the process where pollen and an egg join together inside the ovary of a flower.'},
  {section:'reproduction', difficulty:'easy', type:'mcq', prompt:'To have young or offspring means to…', choices:['Reproduce','Pollinate','Germinate','Disperse'], correctAnswer:'Reproduce',
    explanation:'To reproduce means to have young or offspring — it is why plants and animals flower, mate or lay eggs.'},
  {section:'reproduction', difficulty:'easy', type:'mcq', prompt:'Bees, butterflies, moths, wasps and ants are called ______ because they transfer pollen from the anther to the stigma.', choices:['Pollinators','Predators','Decomposers','Herbivores'], correctAnswer:'Pollinators',
    explanation:'Insects such as bees, butterflies, moths, wasps and ants are called pollinators, because they carry pollen from the anther to the stigma as they visit flowers.'},
  {section:'reproduction', difficulty:'medium', type:'mcq', prompt:"What is the correct order of a plant's life cycle?", choices:['Pollination → Fertilisation → Fruit and seed formation → Seed dispersal → Germination','Germination → Pollination → Seed dispersal → Fertilisation → Fruit and seed formation','Fertilisation → Pollination → Germination → Fruit and seed formation → Seed dispersal','Seed dispersal → Germination → Pollination → Fertilisation → Fruit and seed formation'], correctAnswer:'Pollination → Fertilisation → Fruit and seed formation → Seed dispersal → Germination',
    explanation:'The plant life cycle goes: pollination, then fertilisation, then fruit and seed formation, then seed dispersal, then germination — and the new plant eventually flowers again.'},
  {section:'reproduction', difficulty:'medium', type:'mcq', prompt:'A sycamore seed has papery "wings" attached to it. How is it dispersed?', choices:['It is carried away by the wind','It floats away on water','It is eaten by an animal','It sticks onto an animal\'s fur'], correctAnswer:'It is carried away by the wind',
    explanation:'The papery wings on a sycamore seed let it spin and glide, so it is dispersed by the wind.'},
  {section:'reproduction', difficulty:'medium', type:'mcq', prompt:'A coconut can survive floating in the sea for a long time. How is it dispersed?', choices:['It floats away on water','It is carried away by the wind','It explodes open','It sticks onto an animal\'s fur'], correctAnswer:'It floats away on water',
    explanation:'A coconut has a tough, buoyant husk, so it is dispersed by floating on water, sometimes washing up far from the parent tree.'},
  {section:'reproduction', difficulty:'easy', type:'mcq', prompt:'What is germination?', choices:['When a seed starts to grow','When a flower is pollinated','When a seed is carried away from its parent plant','When a fruit forms around a seed'], correctAnswer:'When a seed starts to grow',
    explanation:'Germination is when a seed starts to grow into a new plant.'},
  {section:'reproduction', difficulty:'hard', type:'mcq', prompt:'Do seeds need light to germinate?', choices:["No — a seed already has its own store of food, so it doesn't need light before it germinates",'Yes — without light a seed can never germinate at all','Yes — light is the only thing a seed needs to germinate','No — seeds need no conditions at all to germinate'], correctAnswer:"No — a seed already has its own store of food, so it doesn't need light before it germinates",
    explanation:"Seeds don't need light to germinate, because they already have their own stored food inside them. They need water, warmth and air instead; they only need light once they have leaves, to start photosynthesising."},

  // --- Sound (8) ---
  {section:'sound', difficulty:'easy', type:'mcq', prompt:'A sound is high or low according to its…', choices:['Pitch','Volume','Decibel','Control variable'], correctAnswer:'Pitch',
    explanation:'A sound is high or low according to its pitch.'},
  {section:'sound', difficulty:'easy', type:'mcq', prompt:'Making a sound louder increases its…', choices:['Volume','Pitch','Decibel scale only','Frequency of colour'], correctAnswer:'Volume',
    explanation:'Making sounds louder increases their volume.'},
  {section:'sound', difficulty:'easy', type:'mcq', prompt:'Sound travels away from its source as…', choices:['Vibrations','Light waves','Decibels','Electricity'], correctAnswer:'Vibrations',
    explanation:'Sound travels from a source as vibrations, which spread outward through the air (or another material) until they reach our ears.'},
  {section:'sound', difficulty:'medium', type:'mcq', prompt:'In a fair test, the variable that is kept exactly the same throughout the investigation is called the…', choices:['Control variable','Independent variable','Dependent variable','Random variable'], correctAnswer:'Control variable',
    explanation:'The control variable is the one kept the same throughout an investigation, so that only the independent variable is changed on purpose.'},
  {section:'sound', difficulty:'easy', type:'tf', prompt:'Cotton wool muffles (softens) sound.', correctAnswer:'True',
    explanation:'True. Soft materials like cotton wool absorb vibrations rather than letting sound pass through easily, so they muffle sound.'},
  {section:'sound', difficulty:'easy', type:'mcq', prompt:'A flute is an example of a…', choices:['Wind instrument','String instrument','Percussion instrument','Electronic instrument'], correctAnswer:'Wind instrument',
    explanation:'A flute makes sound from a column of vibrating air, so it is a wind instrument.'},
  {section:'sound', difficulty:'medium', type:'mcq', prompt:'If you tighten a guitar string, what happens to its pitch?', choices:['The pitch becomes higher','The pitch becomes lower','The pitch stays exactly the same','The string stops making any sound'], correctAnswer:'The pitch becomes higher',
    explanation:'Tightening a string makes it vibrate faster, which raises its pitch.'},
  {section:'sound', difficulty:'medium', type:'mcq', prompt:'Sound usually travels best through which state of matter?', choices:['Solids','Liquids','Gases','It travels equally well through all three'], correctAnswer:'Solids',
    explanation:"Sound travels best through solids, because their particles are packed tightly together so vibrations pass from particle to particle more easily than in liquids or gases."},

  // --- States of Matter (8) ---
  {section:'matter', difficulty:'easy', type:'mcq', prompt:'The state of matter where molecules are far apart and move around freely is called a…', choices:['Gas','Solid','Liquid','Mixture'], correctAnswer:'Gas',
    explanation:'In a gas, the molecules are far apart and move around freely in all directions.'},
  {section:'matter', difficulty:'easy', type:'mcq', prompt:'The state of matter where molecules are tightly packed together and do not move is called a…', choices:['Solid','Gas','Liquid','Vapour'], correctAnswer:'Solid',
    explanation:'In a solid, the molecules are tightly packed together and do not move around.'},
  {section:'matter', difficulty:'easy', type:'mcq', prompt:'The state of matter where molecules move around a little and take the shape of their container is called a…', choices:['Liquid','Solid','Gas','Crystal'], correctAnswer:'Liquid',
    explanation:'In a liquid, the molecules move around a little bit and the liquid takes the shape of whatever container it is in.'},
  {section:'matter', difficulty:'easy', type:'mcq', prompt:'When you add heat to a solid, it will ______ into a liquid.', choices:['Melt','Freeze','Evaporate','Condense'], correctAnswer:'Melt',
    explanation:'Adding heat to a solid makes it melt into a liquid.'},
  {section:'matter', difficulty:'easy', type:'mcq', prompt:'When you take away heat from a liquid, it will ______ into a solid.', choices:['Freeze','Melt','Evaporate','Condense'], correctAnswer:'Freeze',
    explanation:'Taking heat away from a liquid makes it freeze into a solid.'},
  {section:'matter', difficulty:'medium', type:'mcq', prompt:'When you add heat to a liquid and it turns into a gas, this is called…', choices:['Evaporation','Condensation','Freezing','Melting'], correctAnswer:'Evaporation',
    explanation:'When heat is added to a liquid and it turns into a gas, this change of state is called evaporation.'},
  {section:'matter', difficulty:'medium', type:'mcq', prompt:'When you take away heat from a gas and it turns into a liquid, this is called…', choices:['Condensation','Evaporation','Freezing','Melting'], correctAnswer:'Condensation',
    explanation:'When heat is taken away from a gas and it turns into a liquid, this change of state is called condensation — this is how clouds form in the water cycle.'},
  {section:'matter', difficulty:'medium', type:'mcq', prompt:'Where does the energy for the water cycle come from?', choices:['The Sun','Water itself','Plants','The Moon'], correctAnswer:'The Sun',
    explanation:'The energy that drives the water cycle (heating water so it evaporates) comes from the Sun.'},

  // --- Digestive System (10) ---
  {section:'digestive', difficulty:'easy', type:'mcq', prompt:'Which part of the digestive system is where digestion starts?', choices:['The mouth','The stomach','The small intestine','The oesophagus'], correctAnswer:'The mouth',
    explanation:'Digestion starts in the mouth, where food is chewed and mixed with saliva.'},
  {section:'digestive', difficulty:'easy', type:'mcq', prompt:'Which part of the digestive system mixes food with digestive juices?', choices:['The stomach','The mouth','The large intestine','The anus'], correctAnswer:'The stomach',
    explanation:'The stomach mixes food with digestive juices that help break it down further.'},
  {section:'digestive', difficulty:'medium', type:'mcq', prompt:'Which part of the digestive system pushes food down into the stomach?', choices:['The oesophagus','The small intestine','The large intestine','The mouth'], correctAnswer:'The oesophagus',
    explanation:'The oesophagus is the tube that pushes food down from the mouth into the stomach.'},

function generateQuiz(){
  // The exam-scope bank is already sized to match the real end-of-year exam, so use every question.
  return shuffle(RAW_QUESTIONS).map(q => {
    const question = { ...q, id: uid() };
    if (question.type === 'mcq'){
      question.choices = shuffle(question.choices);
    } else {
      question.choices = ['True','False'];
    }
    return question;
  });
}
function sectionNameByKey(key){ const s = SECTIONS.find(x=>x.key===key); return s ? s.name.replace(/&amp;/g,'&') : key; }

/* ===================== PERSISTENCE ===================== */
const LS_SAVE = 'sq_saved_v1';
const LS_HISTORY = 'sq_history_v1';
const LS_XP = 'sq_xp_v1';

function loadJSON(key, fallback){
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch(e){ return fallback; }
}
function saveJSON(key, val){ try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }

function getXP(){ return loadJSON(LS_XP, {xp:0}); }
function addXP(n){ const d = getXP(); d.xp += n; saveJSON(LS_XP, d); return d.xp; }
function levelFromXP(xp){ return Math.floor(xp/100) + 1; }
function xpIntoLevel(xp){ return xp % 100; }

function getHistory(){ return loadJSON(LS_HISTORY, []); }
function pushHistory(entry){ const h = getHistory(); h.unshift(entry); saveJSON(LS_HISTORY, h.slice(0,25)); }

/* ===================== APP STATE ===================== */
let state = null;

function newQuizState(){
  paletteOpen = false;
  return {
    startedAt: Date.now(),
    questions: generateQuiz(),
    index: 0,
    answers: {},
  };
}

function totalCount(){ return state.questions.length; }
function answeredCount(){ return Object.values(state.answers).filter(a=>a.resolved).length; }
function correctCount(){ return Object.values(state.answers).filter(a=>a.resolved && a.correct).length; }
function sectionQuestions(sectionKey){ return state.questions.filter(q=>q.section===sectionKey); }
function sectionAnsweredCount(sectionKey){ return sectionQuestions(sectionKey).filter(q=>state.answers[q.id] && state.answers[q.id].resolved).length; }
function sectionCorrectCount(sectionKey){ return sectionQuestions(sectionKey).filter(q=>state.answers[q.id] && state.answers[q.id].resolved && state.answers[q.id].correct).length; }

/* ===================== RENDERING ===================== */
const app = document.getElementById('app');

function go(view){ window.location.hash = view; render(); }

function render(){
  const hash = window.location.hash.replace('#','') || 'home';
  if (hash === 'home') return renderHome();
  if (hash === 'quiz') return renderQuiz();
  if (hash === 'results') return renderResults();
  if (hash === 'review') return renderReview();
  renderHome();
}
window.addEventListener('hashchange', render);

/* ===================== QUESTION PALETTE (jump to any question) ===================== */
let paletteOpen = false;
function paletteHTML(){
  const items = state.questions.map((q,i) => {
    const ans = state.answers[q.id];
    let cls = 'palette-btn';
    if (i === state.index) cls += ' current';
    if (ans && ans.resolved) cls += ans.correct ? ' correct' : ' incorrect';
    return `<button type="button" class="${cls}" data-idx="${i}">${i+1}</button>`;
  }).join('');
  return `<div class="palette-grid">${items}</div>`;
}
function jumpToQuestion(i){ state.index = i; paletteOpen = false; saveJSON(LS_SAVE, state); render(); }

function computeBadgesForAttempt(report){
  const badges = [];
  if (report.percent === 100) badges.push({e:'🏆', n:'Cum Laude'});
  else if (report.percent >= 90) badges.push({e:'🎖️', n:'Distinction'});
  else if (report.percent >= 75) badges.push({e:'⭐', n:'Merit'});
  report.sectionReports.forEach(sr => { if (sr.percent === 100) badges.push({e:'🌟', n: sr.name+' Master'}); });
  badges.push({e:'✅', n:'Completed'});
  return badges;
}

function renderBadgeShelf(history){
  if (history.length===0) return '<p>Complete a quiz to start earning badges!</p>';
  const all = [];
  history.forEach(h => (h.badges||[]).forEach(b => all.push(b)));
  const seen = new Set();
  const unique = all.filter(b => { const k=b.n; if (seen.has(k)) return false; seen.add(k); return true; });
  if (unique.length===0) return '<p>Complete a quiz to start earning badges!</p>';
  return unique.map(b => `<div class="badge-chip">${b.e}</div>`).join('');
}

function renderQuiz(){
  if (!state){ go('home'); return; }
  const q = state.questions[state.index];
  const total = totalCount();
  const answered = answeredCount();
  const correct = correctCount();
  const percent = answered ? Math.round((correct/answered)*100) : 0;
  const sec = SECTIONS.find(s=>s.key===q.section);
  const secTotal = sectionQuestions(q.section).length;
  const secAnswered = sectionAnsweredCount(q.section);

  const existing = state.answers[q.id];
  const resolved = existing && existing.resolved;

  app.innerHTML = `
    <div class="card progress-wrap">
      <div class="row between">
        <div class="progress-label">Overall Progress</div>
        <div class="progress-label">${answered}/${total}</div>
      </div>
      <div class="bar-outer"><div class="bar-inner overall" style="width:${(answered/total)*100}%"></div></div>
      <div class="row between" style="margin-top:4px">
        <div class="progress-label">${sec.emoji} ${sectionNameByKey(sec.key)}</div>
        <div class="progress-label">${secAnswered}/${secTotal}</div>
      </div>
      <div class="bar-outer"><div class="bar-inner section" style="width:${(secAnswered/secTotal)*100}%"></div></div>
      <div class="score-strip" style="margin-top:6px">

        <div class="score-tile"><div class="num">${state.index+1}/${total}</div><div class="lbl">Question</div></div>
      </div>
      <button class="btn-ghost" id="paletteBtn" style="justify-self:start">🗂️ Jump to any question</button>
    </div>

    ${paletteOpen ? `<div class="card palette-card">${paletteHTML()}</div>` : ''}

    <div class="card qcard" id="qcard">
      <div class="qtop">
        <span class="difficulty-tag ${q.difficulty}">${q.difficulty}</span>
        <span class="pill">${sec.emoji} ${sectionNameByKey(sec.key)}</span>
      </div>
      <div class="qprompt">${q.prompt}</div>
      <div id="answerArea"></div>
      <div id="feedbackArea"></div>
      <div id="memoArea"></div>
      <div class="nav-row">
        <button class="arrow-btn" id="backBtn" ${state.index===0 ? 'disabled':''}>←</button>
        <button class="btn-secondary" id="saveExitBtn">💾 Save &amp; Exit</button>
        <button class="arrow-btn" id="fwdBtn" ${resolved ? '' : 'disabled'}>→</button>
      </div>
    </div>
  `;

  renderAnswerArea(q, existing);

  document.getElementById('backBtn').onclick = () => { state.index = Math.max(0, state.index-1); saveJSON(LS_SAVE, state); render(); };

    if (state.index === total-1){ finishQuiz(); return; }
    state.index++; saveJSON(LS_SAVE, state); render();
  };
  document.getElementById('saveExitBtn').onclick = () => { saveJSON(LS_SAVE, state); go('home'); };
  document.getElementById('paletteBtn').onclick = () => { paletteOpen = !paletteOpen; renderQuiz(); };

    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.onclick = () => jumpToQuestion(Number(btn.getAttribute('data-idx')));
    });
  }
}

function renderAnswerArea(q, existing){
  const answerArea = document.getElementById('answerArea');
  const feedbackArea = document.getElementById('feedbackArea');
  const memoArea = document.getElementById('memoArea');
  const resolved = existing && existing.resolved;

  answerArea.innerHTML = `<div class="choices">${q.choices.map((c,i)=>{
    const letter = String.fromCharCode(65+i);
    let cls = 'choice-btn';
    if (resolved){
      if (c === q.correctAnswer) cls += ' correct';
      else if (existing.lastChosen === c) cls += ' incorrect';
      else cls += ' disabled-other';
    }
    return `<button class="${cls}" data-choice="${esc(c)}" ${resolved?'disabled':''}><span class="choice-letter">${letter}</span><span>${c}</span></button>`;
  }).join('')}</div>`;
  if (!resolved){
    answerArea.querySelectorAll('.choice-btn').forEach(btn => {
      btn.onclick = () => submitAnswer(q, btn.getAttribute('data-choice'));
    });
  }

  if (existing){
    renderFeedback(q, existing, feedbackArea);
    if (resolved) renderMemo(q, memoArea);
  }
}

function renderFeedback(q, ans, container){
  if (!ans.lastWasCorrect && !ans.resolved){
    container.innerHTML = `<div class="feedback-banner incorrect">🤔 Not quite! Give it one more try.</div>`;
  } else if (ans.resolved && ans.correct){
    container.innerHTML = `<div class="feedback-banner correct">${ans.attempts===1 ? '🎉 Correct on the first try! Amazing!' : '✅ Correct! Well done for trying again.'}</div>`;
  } else if (ans.resolved && !ans.correct){
    container.innerHTML = `<div class="feedback-banner wrong-final">📚 Not this time — read the memo below to learn why.</div>`;
  } else {
    container.innerHTML = '';
  }
}

function renderMemo(q, container){
  container.innerHTML = `<div class="memo-box">
    <h4>📝 Study Memo</h4>
    <div class="ans-line">Correct answer: <b>${q.correctAnswer}</b></div>
    <div class="explain">${q.explanation}</div>
  </div>`;
}

function submitAnswer(q, chosenRaw){
  const existing = state.answers[q.id] || {attempts:0, resolved:false};
  existing.attempts += 1;
  existing.lastChosen = chosenRaw;
  const isCorrect = String(chosenRaw) === String(q.correctAnswer);

  if (isCorrect){
    existing.resolved = true;
    existing.correct = true;
    existing.lastWasCorrect = true;
    state.answers[q.id] = existing;
    saveJSON(LS_SAVE, state);
    launchConfetti(existing.attempts===1 ? 60 : 35);
  } else if (existing.attempts >= 1){
    existing.resolved = true;
    existing.correct = false;
    existing.lastWasCorrect = false;
    state.answers[q.id] = existing;
    saveJSON(LS_SAVE, state);
    const card = document.getElementById('qcard');
    card.classList.add('shake'); setTimeout(()=>card.classList.remove('shake'), 420);
  } else {
    existing.resolved = false;
    existing.lastWasCorrect = false;
    state.answers[q.id] = existing;
    saveJSON(LS_SAVE, state);
    const card = document.getElementById('qcard');
    card.classList.add('shake'); setTimeout(()=>card.classList.remove('shake'), 420);
  }
  renderQuiz();
}

function finishQuiz(){
  const total = totalCount();
  const correct = correctCount();
  const percent = Math.round((correct/total)*100);
  const noRetries = Object.values(state.answers).every(a => a.attempts === 1);
  const usedRetries = Object.values(state.answers).some(a => a.attempts > 1);

  const sectionReports = SECTIONS.map(sec => {
    const sq = sectionQuestions(sec.key);
    const sc = sectionCorrectCount(sec.key);
    return {key: sec.key, name: sectionNameByKey(sec.key), emoji: sec.emoji, correct: sc, total: sq.length, percent: Math.round((sc/sq.length)*100)};
  });

  const report = {
    date: Date.now(), correct, total, percent, noRetries, usedRetries, sectionReports,
    questions: state.questions.map(q => ({
      prompt: q.prompt, section: q.section, difficulty: q.difficulty,
      chosen: state.answers[q.id] ? state.answers[q.id].lastChosen : null,
      correctAnswer: q.correctAnswer, wasCorrect: state.answers[q.id] ? !!state.answers[q.id].correct : false,
      explanation: q.explanation
    }))
  };
  report.badges = computeBadgesForAttempt(report);

  const xpEarned = Object.values(state.answers).reduce((s,a)=> s + (a.correct ? (a.attempts===1?10:5) : 0), 0);
  addXP(xpEarned);
  report.xpEarned = xpEarned;

  pushHistory({date: report.date, correct, total, percent, badges: report.badges});
  localStorage.removeItem(LS_SAVE);

  window._lastReport = report;
  go('results');
}

function renderResults(){
  const report = window._lastReport;
  if (!report){ go('home'); return; }
  const stars = report.percent >= 90 ? '⭐⭐⭐' : report.percent >= 70 ? '⭐⭐' : report.percent >= 40 ? '⭐' : '🌱';

  app.innerHTML = `
    <div class="card results-card">
      <h1>${report.percent === 100 ? '🏆 Cum Laude!' : report.percent >= 75 ? '🎉 Great Job!' : '💪 Keep Practising!'}</h1>
      <div class="big-score">${report.correct}/${report.total}</div>
      <div style="font-size:1.2rem;font-weight:800">${report.percent}% · +${report.xpEarned} XP</div>
      <div class="stars-row">${stars}</div>
      <div class="badges-shelf row center">${report.badges.map(b=>`<div class="badge-chip">${b.e}</div>`).join('')}</div>
      <div class="section-report">
        ${report.sectionReports.map(sr => `<div class="sr-row"><span>${sr.emoji} ${sr.name}</span><b>${sr.correct}/${sr.total} (${sr.percent}%)</b></div>`).join('')}
      </div>
      <div class="row center">
        <button class="btn-primary" id="downloadBtn">⬇️ Download Summary</button>
        <button class="btn-warn" id="reviewBtn">🔍 Review Answers</button>
        <button class="btn-good" id="playAgainBtn">🔄 New Quiz</button>
        <button class="btn-secondary" id="homeBtn">🏠 Home</button>
      </div>
    </div>
  `;
  if (report.percent >= 90) launchConfetti(140);

  document.getElementById('downloadBtn').onclick = () => downloadSummary(report);
  document.getElementById('reviewBtn').onclick = () => { reviewFilter = 'all'; go('review'); };
  document.getElementById('playAgainBtn').onclick = () => { state = newQuizState(); saveJSON(LS_SAVE, state); go('quiz'); };
  document.getElementById('homeBtn').onclick = () => go('home');
}

function downloadSummary(report){
  const dateStr = new Date(report.date).toLocaleString();
  const rows = report.questions.map((q,i) => `
    <tr>
      <td style="padding:8px;border:1px solid #ddd">${i+1}</td>
      <td style="padding:8px;border:1px solid #ddd">${sectionNameByKey(q.section)} (${q.difficulty})</td>
      <td style="padding:8px;border:1px solid #ddd">${q.prompt}</td>
      <td style="padding:8px;border:1px solid #ddd">${q.chosen===null?'<i>no answer</i>':q.chosen}</td>
      <td style="padding:8px;border:1px solid #ddd">${q.correctAnswer}</td>
      <td style="padding:8px;border:1px solid #ddd;font-weight:bold;color:${q.wasCorrect?'#04473a':'#8a1f4c'}">${q.wasCorrect?'Correct':'Incorrect'}</td>
      <td style="padding:8px;border:1px solid #ddd">${q.explanation}</td>
    </tr>`).join('');
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Science Quest Results – ${dateStr}</title>
  <style>body{font-family:Arial,sans-serif;padding:20px;color:#1c2541}h1{color:#3a86ff}table{border-collapse:collapse;width:100%;font-size:14px}th{background:#eaf1ff;padding:8px;border:1px solid #ddd;text-align:left}</style>
  </head><body>
  <h1>🔬 Science Quest – Results</h1>
  <p><b>Date:</b> ${dateStr}<br/><b>Score:</b> ${report.correct}/${report.total} (${report.percent}%)<br/><b>Badges earned:</b> ${report.badges.map(b=>b.n).join(', ')}</p>
  <table><thead><tr><th>#</th><th>Topic</th><th>Question</th><th>Your Answer</th><th>Correct Answer</th><th>Result</th><th>Explanation / Memo</th></tr></thead>
  <tbody>${rows}</tbody></table>
  <p style="margin-top:20px;color:#5c6b8a">Generated by Science Quest – keep exploring the world of Natural Sciences!</p>
  </body></html>`;
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `science-quest-results-${new Date(report.date).toISOString().slice(0,10)}.html`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ===================== CONFETTI ===================== */
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
let confettiParticles = [];
let confettiRAF = null;
function launchConfetti(count){
  const colors = ['#3a86ff','#8338ec','#ffbe0b','#06d6a0','#4cc9f0','#ff006e'];
  for (let i=0;i<count;i++){
    confettiParticles.push({
      x: Math.random()*canvas.width, y: -20 - Math.random()*80,
      vx: (Math.random()-0.5)*3, vy: 2+Math.random()*3,
      size: 5+Math.random()*6, color: pick(colors), rot: Math.random()*360, vr:(Math.random()-0.5)*10,
      life: 0, maxLife: 140+Math.random()*60
    });
  }
  if (!confettiRAF) confettiLoop();
}
function confettiLoop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  confettiParticles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.rot += p.vr; p.life++;
    ctx.save();
    ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
    ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, 1 - p.life/p.maxLife);
    ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
    ctx.restore();
  });
  confettiParticles = confettiParticles.filter(p => p.life < p.maxLife && p.y < canvas.height+40);
  if (confettiParticles.length>0){
    confettiRAF = requestAnimationFrame(confettiLoop);
  } else {
    confettiRAF = null;
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }
}

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
