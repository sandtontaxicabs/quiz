<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Learning Quest Hub</title>
<meta name="description" content="Choose a subject: Maths Quest, Word Quest or History Quest — gamified quizzes with instant marking and badges." />
<meta name="theme-color" content="#6c63ff" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<style>
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:"Baloo 2","Trebuchet MS","Segoe UI",Arial,sans-serif;color:#232946;background:#f7f7fb}
body{padding:18px 14px 40px}
.wrap{max-width:520px;margin:0 auto;display:grid;gap:16px}
h1{font-size:1.6rem;margin:0 0 4px}
p.sub{margin:0;color:#6b7394}
.subject-btn{
  display:block; width:100%; text-align:left; border:none; border-radius:18px;
  padding:20px; cursor:pointer; font-family:inherit; color:#fff;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
}
.subject-btn:active{transform:scale(.98)}
.subject-btn.maths{background:#6c63ff}
.subject-btn.english{background:#1b998b}
.subject-btn.history{background:#b8860b}
.subject-btn.science{background:#3a86ff}
.subject-btn .title{font-size:1.25rem;font-weight:900;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.subject-btn .desc{font-size:.9rem;opacity:.95;line-height:1.4;margin-bottom:10px}
.subject-btn .meta{font-size:.8rem;font-weight:700;opacity:.9}
.subject-btn .open{margin-top:10px;font-weight:900;font-size:.92rem}
.footer-note{text-align:center;font-size:.78rem;color:#8a90a8;padding-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>🌈 Learning Quest Hub</h1>
    <p class="sub">Tap a subject to start a fresh, gamified quiz.</p>
  </div>

  <button type="button" class="subject-btn maths" onclick="window.location.href='maths.html'">
    <div class="title">🔢 Maths Quest</div>
    <div class="desc">Area &amp; Perimeter and Laws of Arithmetic — composite shapes, missing sides, and mental-maths tricks.</div>
    <div class="meta" id="metaMaths"></div>
    <div class="open">Open Maths Quest →</div>
  </button>

  <button type="button" class="subject-btn english" onclick="window.location.href='english.html'">
    <div class="title">📚 Word Quest</div>
    <div class="desc">Fairy tale features, phrases &amp; clauses, sentences, verb tenses, pronouns, homophones and rhyme.</div>
    <div class="meta" id="metaEnglish"></div>
    <div class="open">Open Word Quest →</div>
  </button>

  <button type="button" class="subject-btn history" onclick="window.location.href='history.html'">
    <div class="title">🏺 History Quest</div>
    <div class="desc">50 questions on Ancient Egypt — the Nile, social structure, homes, farming and more.</div>
    <div class="meta" id="metaHistory"></div>
    <div class="open">Open History Quest →</div>
  </button>

  <button type="button" class="subject-btn science" onclick="window.location.href='science.html'">
    <div class="title">🔬 Science Quest</div>
    <div class="desc">Forces, gravity, satellites and friction — normal force, applied forces, orbits and resistance.</div>
    <div class="meta" id="metaScience"></div>
    <div class="open">Open Science Quest →</div>
  </button>

  <div class="footer-note">Works offline · Install this hub to your home screen · Progress is saved separately for each subject</div>
</div>

<script>
function loadJSON(key, fallback){
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch(e){ return fallback; }
}
function levelFromXP(xp){ return Math.floor(xp/100) + 1; }

const SUBJECTS = [
  {metaId:'metaMaths', xpKey:'mq_xp_v1', historyKey:'mq_history_v1'},
  {metaId:'metaEnglish', xpKey:'wq_xp_v1', historyKey:'wq_history_v1'},
  {metaId:'metaHistory', xpKey:'hq_xp_v1', historyKey:'hq_history_v1'},
  {metaId:'metaScience', xpKey:'sq_xp_v1', historyKey:'sq_history_v1'}
];

SUBJECTS.forEach(s => {
  const xpData = loadJSON(s.xpKey, {xp:0});
  const level = levelFromXP(xpData.xp);
  const hist = loadJSON(s.historyKey, []);
  const attempts = hist.length;
  const best = attempts ? Math.max(...hist.map(h => h.percent)) : null;
  const el = document.getElementById(s.metaId);
  el.textContent = attempts
    ? `Level ${level} · ${attempts} attempt${attempts===1?'':'s'} · Best ${best}%`
    : `Level ${level} · Not started yet`;
});
</script>
</body>
</html>
