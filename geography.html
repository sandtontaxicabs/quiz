.paragraph-box .paragraph-text{color:var(--ink);line-height:1.65;font-size:.92rem}

.review-q-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.review-topic{font-size:.72rem;color:var(--muted);text-transform:uppercase;font-weight:800;letter-spacing:.03em;margin-bottom:4px}

.nav-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.arrow-btn{width:52px;height:52px;border-radius:50%;font-size:1.3rem;display:flex;align-items:center;justify-content:center;background:#e6f5f1;color:var(--purple);box-shadow:0 6px 14px rgba(20,80,70,.14)}

.results-card{text-align:center;display:grid;gap:14px}
.big-score{font-size:3rem;font-weight:900;background:linear-gradient(135deg,var(--purple),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}

.section-report{text-align:left;display:grid;gap:8px}
.section-report .sr-row{display:flex;justify-content:space-between;background:#f2faf7;border-radius:14px;padding:10px 12px;border:1px solid #d9efe8}

.tab-btn.active{background:var(--purple);color:#fff}

<script>
/* ===================== UTILITIES ===================== */
const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const pick = (arr) => arr[rnd(0, arr.length - 1)];
const uid = () => Math.random().toString(36).slice(2, 10);
function shuffle(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){const j=rnd(0,i); [a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

/* ===================== FIXED QUESTION BANK: Grade 5 End-of-Year Exam Scope =====================
   Scope (from the official exam scope table): Physical features, Rivers, South
   Africa's neighbouring countries, Weather and Climate, Interpreting weather
   maps, Minerals mined in South Africa, Safety of miners, Coal formation.
   Each question belongs to one of the 8 topics in SECTIONS below, each of
   which carries its own educational paragraph (shown with every question
   drawn from that topic) — comprehension-style, matching History Quest. Each
   quiz attempt draws a random, topic-balanced sample of 50 from this larger
   pool, so repeated attempts are not identical. */
const RAW_QUESTIONS = [
  // --- Physical Features (14) ---
  {section:'physicalFeatures', difficulty:'easy', type:'mcq', prompt:'What is a physical map?', choices:['A map which shows natural features like mountains, deserts, rivers and lakes','A map which only shows roads and borders','A map of the stars','A map that shows only cities'], correctAnswer:'A map which shows natural features like mountains, deserts, rivers and lakes',
    explanation:'A physical map shows natural features such as mountains, deserts, rivers and lakes, rather than man-made things like roads and borders.'},
  {section:'physicalFeatures', difficulty:'easy', type:'mcq', prompt:'What is altitude?', choices:['The height of a place above sea level','The temperature of a place','The width of a river','The distance to the nearest city'], correctAnswer:'The height of a place above sea level',
    explanation:'Altitude is the height of a place above sea level.'},
  {section:'physicalFeatures', difficulty:'easy', type:'mcq', prompt:'What does "sea level" mean?', choices:['The height at which the sea touches the land, used as the starting point for measuring height','The deepest point in the ocean','The height of the tallest mountain','The average temperature of the sea'], correctAnswer:'The height at which the sea touches the land, used as the starting point for measuring height',
    explanation:'Sea level is the height at which the sea touches the land, and it is used as the starting point (0 metres) for measuring the height of everywhere else.'},
  {section:'physicalFeatures', difficulty:'medium', type:'mcq', prompt:'What is a plateau?', choices:['A high, flat, inland area of a country','Low-lying land near the sea','A dent in the coastline','A small river'], correctAnswer:'A high, flat, inland area of a country',
    explanation:'A plateau is a high, flat, inland area of a country.'},
  {section:'physicalFeatures', difficulty:'medium', type:'mcq', prompt:'What is a coastal plain?', choices:['Low-lying land that is close to the sea','A high mountain range','A deep river valley','An underground cave'], correctAnswer:'Low-lying land that is close to the sea',
    explanation:'A coastal plain is low-lying land that is close to the sea.'},
  {section:'physicalFeatures', difficulty:'medium', type:'mcq', prompt:'What is an escarpment?', choices:['Where land rises steeply between the coastal plain and the plateau, mainly made up of mountain ranges','A flat area with no hills at all','A type of river mouth','A kind of desert'], correctAnswer:'Where land rises steeply between the coastal plain and the plateau, mainly made up of mountain ranges',
    explanation:'An escarpment is where land rises steeply between the coastal plain and the plateau, and is mainly made up of mountain ranges.'},
  {section:'physicalFeatures', difficulty:'easy', type:'mcq', prompt:'What is a mountain range?', choices:['A group or line of mountains','A single tall mountain','A type of desert','A river that flows through mountains'], correctAnswer:'A group or line of mountains',
    explanation:'A mountain range is a group or line of mountains.'},
  {section:'physicalFeatures', difficulty:'easy', type:'mcq', prompt:'What is the highest point at the top of a mountain called?', choices:['A peak','A plateau','A valley','A cape'], correctAnswer:'A peak',
    explanation:'The highest point at the top of a mountain is called a peak.'},
  {section:'physicalFeatures', difficulty:'medium', type:'mcq', prompt:'Which mountain is the highest peak in Africa?', choices:['Mount Kilimanjaro, in Tanzania','Mount Kenya, in Kenya','Table Mountain, in South Africa','The Drakensberg, in South Africa'], correctAnswer:'Mount Kilimanjaro, in Tanzania',
    explanation:'Mount Kilimanjaro, in Tanzania, is the highest peak in Africa at 5,895 metres above sea level.'},
  {section:'physicalFeatures', difficulty:'medium', type:'mcq', prompt:'Which mountain range is the highest in Southern Africa?', choices:['The Drakensberg (uKhahlamba)','Table Mountain','The Namib range','The Cape Fold range'], correctAnswer:'The Drakensberg (uKhahlamba)',
    explanation:'The Drakensberg, also known as uKhahlamba, is the highest mountain range in Southern Africa.'},
  {section:'physicalFeatures', difficulty:'easy', type:'mcq', prompt:'What is a hill?', choices:['A raised area of land that is not as large as a mountain','A dent in the coastline','A type of river','A flat plateau'], correctAnswer:'A raised area of land that is not as large as a mountain',
    explanation:'A hill is a raised area of land that is not as large as a mountain.'},
  {section:'physicalFeatures', difficulty:'easy', type:'mcq', prompt:'What is a valley?', choices:['A low area of land between hills or mountains','The highest point of a mountain','A piece of land that juts into the sea','A type of desert'], correctAnswer:'A low area of land between hills or mountains',
    explanation:'A valley is a low area of land found between hills or mountains.'},
  {section:'physicalFeatures', difficulty:'medium', type:'mcq', prompt:'What do we call a piece of land that juts out into the sea?', choices:['A cape','A bay','A plateau','An escarpment'], correctAnswer:'A cape',
    explanation:'A cape is a piece of land that juts out into the sea.'},
  {section:'physicalFeatures', difficulty:'medium', type:'mcq', prompt:'What do we call a dent or curve in the coastline?', choices:['A bay','A cape','A valley','A peak'], correctAnswer:'A bay',
    explanation:'A bay is a dent or curve in the coastline.'},

  // --- Rivers (14) ---
  {section:'rivers', difficulty:'easy', type:'mcq', prompt:'Where does a river begin?', choices:['At its source','At its mouth','At a dam','At the equator'], correctAnswer:'At its source',
    explanation:'A river begins at its source, usually high up in the mountains.'},
  {section:'rivers', difficulty:'easy', type:'mcq', prompt:'What is a small river called?', choices:['A stream','A tributary','A catchment','A delta'], correctAnswer:'A stream',
    explanation:'A small river is called a stream.'},
  {section:'rivers', difficulty:'easy', type:'mcq', prompt:'What is a tributary?', choices:['A stream or river that flows into a bigger river','The place where a river ends','A type of dam','A type of lake'], correctAnswer:'A stream or river that flows into a bigger river',
    explanation:'A tributary is a stream or river that flows into a bigger river.'},
  {section:'rivers', difficulty:'easy', type:'mcq', prompt:'What do we call the point where a river flows into the sea?', choices:['Its mouth','Its source','Its tributary','Its catchment'], correctAnswer:'Its mouth',
    explanation:'The point where a river flows into the sea (or a lake or another river) is called its mouth.'},
  {section:'rivers', difficulty:'medium', type:'mcq', prompt:'What is a catchment area?', choices:['The area of land drained by a river and its tributaries','The place where a river begins','A type of waterfall','A man-made canal'], correctAnswer:'The area of land drained by a river and its tributaries',
    explanation:'A catchment area is the area of land drained by a river and its tributaries.'},
  {section:'rivers', difficulty:'medium', type:'mcq', prompt:'What do we call all the rivers and streams that drain into one river, together with the land they flow through?', choices:['A river system','A catchment only','A delta','An estuary'], correctAnswer:'A river system',
    explanation:'All the rivers and streams that drain into one river, together with the land they flow through, is called a river system.'},
  {section:'rivers', difficulty:'easy', type:'mcq', prompt:'Do rivers ever flow uphill?', choices:['No, rivers always flow from a higher place to a lower place','Yes, rivers often flow uphill','Only during floods','Only in deserts'], correctAnswer:'No, rivers always flow from a higher place to a lower place',
    explanation:'Rivers always flow downwards, from a higher place to a lower place, never uphill.'},
  {section:'rivers', difficulty:'medium', type:'mcq', prompt:'Which South African river is the longest river entirely within South Africa, and forms the border with Namibia?', choices:['The Orange (Gariep) River','The Limpopo River','The Vaal River','The Tugela River'], correctAnswer:'The Orange (Gariep) River',
    explanation:'The Orange (Gariep) River is the longest river entirely within South Africa, and forms part of the border with Namibia.'},
  {section:'rivers', difficulty:'medium', type:'mcq', prompt:"Which river forms South Africa's northern border with Zimbabwe and Botswana?", choices:['The Limpopo River','The Orange River','The Vaal River','The Nile'], correctAnswer:'The Limpopo River',
    explanation:"The Limpopo River forms South Africa's northern border with Zimbabwe and Botswana."},
  {section:'rivers', difficulty:'medium', type:'mcq', prompt:'Which river is the longest river on the entire African continent?', choices:['The Nile','The Congo','The Orange','The Limpopo'], correctAnswer:'The Nile',
    explanation:'The Nile, in the north of Africa, is the longest river on the entire continent.'},
  {section:'rivers', difficulty:'hard', type:'mcq', prompt:'Which African river is unusual because it crosses the equator twice?', choices:['The Congo River','The Nile','The Orange River','The Zambezi'], correctAnswer:'The Congo River',
    explanation:'The Congo River is unusual because it is the only major river in the world that crosses the equator twice.'},
  {section:'rivers', difficulty:'medium', type:'mcq', prompt:'What is the Vaal River?', choices:['A major tributary of the Orange River','The longest river in Africa','A desert in Namibia','A lake in Tanzania'], correctAnswer:'A major tributary of the Orange River',
    explanation:'The Vaal River is a major tributary of the Orange River.'},
  {section:'rivers', difficulty:'medium', type:'mcq', prompt:'Why is river water often stored behind a dam, like the Vaal Dam in Gauteng?', choices:['To provide water for homes, industry and irrigating farmland in drier areas','To stop the river flowing to the sea completely','To create a new mountain range','To cool down the climate'], correctAnswer:'To provide water for homes, industry and irrigating farmland in drier areas',
    explanation:'Dams like the Vaal Dam store river water to provide water for homes, industry, and irrigating farmland in drier areas.'},
  {section:'rivers', difficulty:'medium', type:'mcq', prompt:'In which country does the Orange-Gariep River begin (its source)?', choices:['Lesotho','Namibia','Botswana','Zimbabwe'], correctAnswer:'Lesotho',
    explanation:'The Orange-Gariep River begins (has its source) in Lesotho.'},
  {section:'rivers', difficulty:'medium', type:'mcq', prompt:'What is a confluence?', choices:['The exact point where two rivers meet','The place where a river begins','A type of waterfall','A man-made canal'], correctAnswer:'The exact point where two rivers meet',
    explanation:'A confluence is the exact point where two rivers meet.'},
  {section:'rivers', difficulty:'medium', type:'mcq', prompt:'At the confluence of the Vaal and Orange Rivers, what happens?', choices:['The Vaal River, a tributary, joins the Orange River at this exact meeting point','The Vaal River stops flowing completely','The two rivers flow apart from each other','The Orange River flows into the Vaal River instead'], correctAnswer:'The Vaal River, a tributary, joins the Orange River at this exact meeting point',
    explanation:'The Vaal River, a tributary of the Orange River, joins it at their confluence — the exact point where the two rivers meet.'},

  // --- South Africa's Neighbouring Countries (14) ---
  {section:'neighbouringCountries', difficulty:'easy', type:'mcq', prompt:'How many countries share a land border with South Africa?', choices:['Six','Four','Eight','Ten'], correctAnswer:'Six',
    explanation:'South Africa shares a land border with six neighbouring countries: Namibia, Botswana, Zimbabwe, Mozambique, Eswatini and Lesotho.'},

const SECTIONS = [
  {key:'physicalFeatures', name:'Physical Features', emoji:'🏔️', color:'linear-gradient(135deg,#264653,#1b3a3a)',
    paragraph:"A physical map is a map which shows the natural features of a place, such as mountains, deserts, rivers and lakes, rather than man-made things like roads and borders. On a physical map, the height of land (called altitude) is usually shown using different colours or shading — the higher the land, the darker the shading usually is. Altitude is the height of a place above sea level, and sea level is the height at which the sea touches the land, used as the starting point (0 metres) for measuring height everywhere else. A plateau is a high, flat, inland area of a country. A coastal plain is low-lying land that is close to the sea. An escarpment is where the land rises steeply between the coastal plain and the plateau — these are mainly made up of mountain ranges. A mountain range is a group or line of mountains, and the highest point at the top of a mountain is called its peak. Mount Kilimanjaro in Tanzania, at 5,895 metres above sea level, is the highest peak in Africa; Mount Kenya is the second highest. In Southern Africa, the Drakensberg (also known as uKhahlamba) is the highest mountain range. A hill is a raised area of land that is not as large as a mountain, and a valley is a low area of land found between hills or mountains. Along the coast, a cape is a piece of land that juts out into the sea, while a bay is a dent or curve in the coastline."},
  {key:'rivers', name:'Rivers', emoji:'🌊', color:'linear-gradient(135deg,#48cae4,#0077b6)',
    paragraph:"A river begins at its source, usually high up in the mountains where rain or melting snow collects. A small river is called a stream, and when a stream or smaller river flows into a bigger river, it is called a tributary. As a river flows, it passes through valleys between hills, before crossing the flat coastal plain on its way to the sea. The point where a river finally flows into the sea (or into a lake or another river) is called its mouth. All the rivers and streams that drain into one river, together with the land area they flow through, is called a catchment area — all of this together, both the water and the land, is known as a river system. Rivers always flow downwards, from a higher place to a lower place, never uphill. South Africa's rivers include the Orange (Gariep) River, the longest river entirely within South Africa, which starts in Lesotho and forms the border with Namibia; the Limpopo River, which forms the northern border with Zimbabwe and Botswana; and the Vaal River, a major tributary of the Orange. The exact point where two rivers meet is called a confluence — for example, the Vaal River meets the Orange River at their confluence. The Nile, in the north of Africa, is the longest river on the entire continent, while the Congo River is the only major river in the world that crosses the equator twice. River water is often stored behind a dam, like the Vaal Dam in Gauteng, to provide water for homes, industry, and irrigating farmland in drier areas."},
  {key:'neighbouringCountries', name:"Neighbouring Countries", emoji:'🗺️', color:'linear-gradient(135deg,#9d4edd,#5a189a)',
    paragraph:"South Africa shares land borders with six neighbouring countries: Namibia, Botswana, Zimbabwe, Mozambique, Eswatini (formerly known as Swaziland) and Lesotho. A border is the line that divides one country from another, and can follow a river, a mountain range, or simply a straight line agreed between countries. Most of South Africa's neighbours have a coastline, where their land meets the sea, but two of them do not: Lesotho and Eswatini are landlocked, meaning they are completely surrounded by other countries and have no direct access to the sea. Lesotho is unusual because it is surrounded entirely by South Africa alone. Each of South Africa's neighbouring countries has its own capital city — Zimbabwe's capital is Harare, Botswana's is Gaborone, Namibia's is Windhoek, Mozambique's is Maputo, Eswatini's is Mbabane, and Lesotho's is Maseru. South Africa itself unusually has three capital cities: Pretoria (the administrative capital), Cape Town (the legislative capital, where parliament sits) and Bloemfontein (the judicial capital)."},
  {key:'weatherClimate', name:'Weather &amp; Climate', emoji:'⛅', color:'linear-gradient(135deg,#ffb703,#fb8500)',
    paragraph:"Weather is what the atmosphere or air is like at a particular place on a particular day — for example, whether it is sunny, rainy, windy or cold today. Climate, on the other hand, is the average weather conditions of an area over a long period of time, such as many years. The main elements of weather are temperature, rainfall, wind, cloud cover and humidity (how much moisture is in the air). South Africa has several different climate regions: the Western Cape has a Mediterranean climate, with hot, dry summers and cold, wet winters — most of its rain falls in winter. The Eastern Cape coast and the KwaZulu-Natal coast have hot, wet summers and warm winters, with some rainfall on the coast all year. The Limpopo and Mpumalanga area bordering Mozambique is very hot with wet summers and warm, dry winters. The Northern Cape is very hot and dry, with very little rain all year. The western parts of the Free State and North West are hot and dry in summer, and cold and dry in winter. Climate affects what kind of natural vegetation can grow in an area, and what kind of farming people can do there."},
  {key:'interpretingWeatherMaps', name:'Interpreting Weather Maps', emoji:'🗺️☀️', color:'linear-gradient(135deg,#4cc9f0,#1d3557)',
    paragraph:"Weather maps and forecasts are useful for showing what the weather conditions in different places in a country will be like, often for the following day or over several days ahead — this is called a forecast. People who study the weather and make these forecasts are called meteorologists. On a weather map, symbols such as a sun, clouds or raindrops are used to show the expected weather at different cities, along with the expected temperature in degrees Celsius. Cloud cover describes how much of the sky is covered by cloud, from a clear sky with no cloud, to a partly cloudy sky, to a sky that is completely overcast. To read a weather map correctly, you need to look carefully at the symbol and number given for each place — the city with the sunniest symbol and highest number is usually the hottest, while a city shown with rain and a lower number will be cooler and wetter. Temperatures on a weather map are often written as two numbers, like 14 / 26 — the first number is the minimum (night or early morning) temperature, and the second is the maximum (daytime) temperature. A sun symbol partly hidden behind a cloud means partly cloudy weather, clouds with raindrops mean rainy weather, and a cloud with a lightning bolt means thunderstorms are expected. Arrows on a weather map show wind direction — pointing in the direction the wind is blowing toward — and sometimes wind speed too, in km/h or knots. Weather instruments like the thermometer (which measures temperature), rain gauge (rainfall), wind vane (wind direction), anemometer (wind speed), barometer (air pressure) and hygrometer (humidity) are used to gather the real information that goes into these forecasts and maps."},
  {key:'mineralsMined', name:'Minerals Mined in SA', emoji:'⛏️', color:'linear-gradient(135deg,#6c757d,#343a40)',
    paragraph:"Minerals are useful, non-living substances found in rocks under the ground, and South Africa is rich in many different minerals. Gold is mainly used for jewellery, electronics and coins, and is mined deeply underground in Gauteng and the Free State; platinum is used in jewellery, the car industry (to reduce pollution from car exhausts) and electrical industries, and is mostly mined in North West and Limpopo; diamonds are used for jewellery and in cutting machines, and are mostly mined in the Northern Cape and Limpopo; coal is used to generate electrical power and to make things like tar for roads, plastic and soap, and is mainly mined in Mpumalanga; iron ore is used for buildings, vehicles and machines, and for making steel, and is mainly mined in the Northern Cape; copper is used for pipes, electrical wires and jewellery; manganese and chrome are used to strengthen steel and prevent rust, as well as for batteries, cans and alloy parts of machines. Minerals are a non-renewable resource, which means that once they are used up, they cannot be replaced or regrown by nature or by people — this is very different from a renewable resource like water, wind or plants, which will not run out if they are managed properly. There are two main ways of mining minerals: open pit (surface) mining, where layers of soil and rock are removed from the surface to reach minerals close to the surface, and underground (shaft or deep-level) mining, where long tunnels are dug deep underground to reach minerals that lie far below the surface. Some of South Africa's underground mines are among the deepest in the world, reaching several kilometres below the ground."},
  {key:'safetyOfMiners', name:'Safety of Miners', emoji:'⚠️', color:'linear-gradient(135deg,#b0413e,#7a2420)',
    paragraph:"Mining can be dangerous for both miners and the environment. Underground mining in particular can be risky for miners, who work deep below the surface in tunnels, so mines must follow strict safety rules to protect workers from accidents, collapses and exposure to harmful dust or gases. Mining also produces a lot of waste, in the form of polluted water, rock and sand — mining companies often dump this waste in piles called mine dumps, and sometimes this waste pollutes nearby rivers, making the water harmful to people, plants and animals; farmers have sometimes been warned not to let their animals drink from, or irrigate crops with, water polluted by mining. When a mine is no longer being used, it often leaves behind a large hole that gradually fills with water. Poisonous chemicals that were trapped underground, such as acid and uranium, can dissolve into this water and flow into groundwater, which can travel for hundreds of kilometres and eventually reach rivers and lakes used for drinking, farming and by wildlife. Chemicals and dust from mining can also damage natural vegetation and wildlife habitats directly, and in the past, before people understood the dangers, some minerals like asbestos were even used as a building material, even though asbestos fibres are now known to damage the lungs and can cause cancer. Air pollution from mining dust and fumes can also cause disease. This is especially serious in South Africa because about 98% of the country is arid or dry, meaning there are already water shortages — if the available water becomes polluted too, there is even less water for people, animals and farming."},

const DRAW_PLAN = {
  physicalFeatures:7, rivers:7, neighbouringCountries:7, weatherClimate:7,
  interpretingWeatherMaps:6, mineralsMined:7, safetyOfMiners:5, coalFormation:4
};

function generateQuiz(){
  // Draws a random, topic-balanced sample of 50 from the larger pool, so every
  // attempt (and every restart) is a different set of 50 questions.
  const pool = [];
  SECTIONS.forEach(sec => {
    const topicQs = shuffle(RAW_QUESTIONS.filter(q => q.section === sec.key));
    const count = DRAW_PLAN[sec.key] || 0;
    pool.push(...topicQs.slice(0, count));
  });
  return shuffle(pool).map(q => {
    const question = { ...q, id: uid() };
    question.choices = shuffle(question.choices);
    return question;
  });
}
function sectionNameByKey(key){ const s = SECTIONS.find(x=>x.key===key); return s ? s.name.replace(/&amp;/g,'&') : key; }

/* ===================== PERSISTENCE ===================== */
const LS_SAVE = 'gq_saved_v1';
const LS_HISTORY = 'gq_history_v1';
const LS_XP = 'gq_xp_v1';

function loadJSON(key, fallback){
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch(e){ return fallback; }
}
function saveJSON(key, val){ try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }

function getXP(){ return loadJSON(LS_XP, {xp:0}); }
function addXP(n){ const d = getXP(); d.xp += n; saveJSON(LS_XP, d); return d.xp; }
function levelFromXP(xp){ return Math.floor(xp/100) + 1; }
function xpIntoLevel(xp){ return xp % 100; }

function getHistory(){ return loadJSON(LS_HISTORY, []); }
function pushHistory(entry){ const h = getHistory(); h.unshift(entry); saveJSON(LS_HISTORY, h.slice(0,25)); }

/* ===================== APP STATE ===================== */
let state = null;

function newQuizState(){
  paletteOpen = false;
  return {
    startedAt: Date.now(),
    questions: generateQuiz(),
    index: 0,
    answers: {},
  };
}

function totalCount(){ return state.questions.length; }
function answeredCount(){ return Object.values(state.answers).filter(a=>a.resolved).length; }
function correctCount(){ return Object.values(state.answers).filter(a=>a.resolved && a.correct).length; }
function sectionQuestions(sectionKey){ return state.questions.filter(q=>q.section===sectionKey); }
function sectionAnsweredCount(sectionKey){ return sectionQuestions(sectionKey).filter(q=>state.answers[q.id] && state.answers[q.id].resolved).length; }
function sectionCorrectCount(sectionKey){ return sectionQuestions(sectionKey).filter(q=>state.answers[q.id] && state.answers[q.id].resolved && state.answers[q.id].correct).length; }

/* ===================== RENDERING ===================== */
const app = document.getElementById('app');

function go(view){ window.location.hash = view; render(); }

function render(){
  const hash = window.location.hash.replace('#','') || 'home';
  if (hash === 'home') return renderHome();
  if (hash === 'quiz') return renderQuiz();
  if (hash === 'results') return renderResults();
  if (hash === 'review') return renderReview();
  renderHome();
}
window.addEventListener('hashchange', render);

/* ===================== PROGRESS MAP (read-only during the quiz — no jumping) =====================
   Going back is blocked until the quiz is completed, so that learners must read
   every paragraph in order (paragraphs seed facts for later questions). This map
   only shows progress; it is not clickable during a live quiz. */
let paletteOpen = false;
function paletteHTML(){
  const items = state.questions.map((q,i) => {
    const ans = state.answers[q.id];
    let cls = 'palette-btn';
    if (i === state.index) cls += ' current';
    if (ans && ans.resolved) cls += ans.correct ? ' correct' : ' incorrect';
    return `<button type="button" class="${cls}" disabled>${i+1}</button>`;
  }).join('');
  return `<div class="palette-grid">${items}</div><div class="locked-note">🔒 You can't jump around or go back until the quiz is finished — this keeps every paragraph's facts in play for later questions.</div>`;
}

function computeBadgesForAttempt(report){
  const badges = [];
  if (report.percent === 100) badges.push({e:'🏆', n:'Cum Laude'});
  else if (report.percent >= 90) badges.push({e:'🎖️', n:'Distinction'});
  else if (report.percent >= 75) badges.push({e:'⭐', n:'Merit'});
  report.sectionReports.forEach(sr => { if (sr.percent === 100) badges.push({e:'🌟', n: sr.name+' Master'}); });
  badges.push({e:'✅', n:'Completed'});
  return badges;
}

function renderBadgeShelf(history){
  if (history.length===0) return '<p>Complete a quiz to start earning badges!</p>';
  const all = [];
  history.forEach(h => (h.badges||[]).forEach(b => all.push(b)));
  const seen = new Set();
  const unique = all.filter(b => { const k=b.n; if (seen.has(k)) return false; seen.add(k); return true; });
  if (unique.length===0) return '<p>Complete a quiz to start earning badges!</p>';
  return unique.map(b => `<div class="badge-chip">${b.e}</div>`).join('');
}

function renderQuiz(){
  if (!state){ go('home'); return; }

  const answered = answeredCount();

  const percent = answered ? Math.round((correct/answered)*100) : 0;

  const secTotal = sectionQuestions(q.section).length;
  const secAnswered = sectionAnsweredCount(q.section);

  const existing = state.answers[q.id];
  const resolved = existing && existing.resolved;

  app.innerHTML = `
    <div class="card progress-wrap">
      <div class="row between">
        <div class="progress-label">Overall Progress</div>
        <div class="progress-label">${answered}/${total}</div>
      </div>

      <div class="row between" style="margin-top:4px">

        <div class="progress-label">${secAnswered}/${secTotal}</div>

    <div class="card qcard" id="qcard">
      <div class="qtop">
        <span class="difficulty-tag ${q.difficulty}">${q.difficulty === 'grade6' ? 'Grade 6 ⭐' : q.difficulty}</span>
        <span class="pill">${sec.emoji} ${sectionNameByKey(sec.key)}</span>

        <button class="arrow-btn" id="fwdBtn" ${resolved ? '' : 'disabled'}>→</button>
      </div>
    </div>
  `;

  renderAnswerArea(q, existing);

  document.getElementById('fwdBtn').onclick = () => {
    if (state.index === total-1){ finishQuiz(); return; }
    state.index++; saveJSON(LS_SAVE, state); render();
  };
  document.getElementById('saveExitBtn').onclick = () => { saveJSON(LS_SAVE, state); go('home'); };
  document.getElementById('paletteBtn').onclick = () => { paletteOpen = !paletteOpen; renderQuiz(); };
}

function renderAnswerArea(q, existing){
  const answerArea = document.getElementById('answerArea');
  const feedbackArea = document.getElementById('feedbackArea');
  const memoArea = document.getElementById('memoArea');
  const resolved = existing && existing.resolved;

  answerArea.innerHTML = `<div class="choices">${q.choices.map((c,i)=>{
    const letter = String.fromCharCode(65+i);
    let cls = 'choice-btn';
    if (resolved){
      if (c === q.correctAnswer) cls += ' correct';
      else if (existing.lastChosen === c) cls += ' incorrect';
      else cls += ' disabled-other';
    }
    return `<button class="${cls}" data-choice="${esc(c)}" ${resolved?'disabled':''}><span class="choice-letter">${letter}</span><span>${c}</span></button>`;
  }).join('')}</div>`;
  if (!resolved){
    answerArea.querySelectorAll('.choice-btn').forEach(btn => {
      btn.onclick = () => submitAnswer(q, btn.getAttribute('data-choice'));
    });
  }

  if (existing){
    renderFeedback(q, existing, feedbackArea);
    if (resolved) renderMemo(q, memoArea);
  }
}

function renderFeedback(q, ans, container){
  if (!ans.lastWasCorrect && !ans.resolved){
    container.innerHTML = `<div class="feedback-banner incorrect">🤔 Not quite! Give it one more try.</div>`;
  } else if (ans.resolved && ans.correct){
    container.innerHTML = `<div class="feedback-banner correct">${ans.attempts===1 ? '🎉 Correct on the first try! Amazing!' : '✅ Correct! Well done for trying again.'}</div>`;
  } else if (ans.resolved && !ans.correct){
    container.innerHTML = `<div class="feedback-banner wrong-final">📚 Not this time — read the memo below to learn why.</div>`;
  } else {
    container.innerHTML = '';
  }
}

function renderMemo(q, container){
  container.innerHTML = `<div class="memo-box">
    <h4>📝 Study Memo</h4>
    <div class="ans-line">Correct answer: <b>${q.correctAnswer}</b></div>
    <div class="explain">${q.explanation}</div>
  </div>`;
}

function submitAnswer(q, chosenRaw){
  const existing = state.answers[q.id] || {attempts:0, resolved:false};
  existing.attempts += 1;
  existing.lastChosen = chosenRaw;
  const isCorrect = String(chosenRaw) === String(q.correctAnswer);

  if (isCorrect){
    existing.resolved = true;
    existing.correct = true;
    existing.lastWasCorrect = true;
    state.answers[q.id] = existing;
    saveJSON(LS_SAVE, state);
    launchConfetti(existing.attempts===1 ? 60 : 35);
  } else if (existing.attempts >= 1){
    existing.resolved = true;
    existing.correct = false;
    existing.lastWasCorrect = false;
    state.answers[q.id] = existing;
    saveJSON(LS_SAVE, state);
    const card = document.getElementById('qcard');
    card.classList.add('shake'); setTimeout(()=>card.classList.remove('shake'), 420);
  } else {
    existing.resolved = false;
    existing.lastWasCorrect = false;
    state.answers[q.id] = existing;
    saveJSON(LS_SAVE, state);
    const card = document.getElementById('qcard');
    card.classList.add('shake'); setTimeout(()=>card.classList.remove('shake'), 420);
  }
  renderQuiz();
}

function finishQuiz(){
  const total = totalCount();
  const correct = correctCount();
  const percent = Math.round((correct/total)*100);
  const noRetries = Object.values(state.answers).every(a => a.attempts === 1);
  const usedRetries = Object.values(state.answers).some(a => a.attempts > 1);

  const sectionReports = SECTIONS.map(sec => {
    const sq = sectionQuestions(sec.key);
    const sc = sectionCorrectCount(sec.key);
    return {key: sec.key, name: sectionNameByKey(sec.key), emoji: sec.emoji, correct: sc, total: sq.length, percent: sq.length ? Math.round((sc/sq.length)*100) : 0};
  }).filter(sr => sr.total > 0);

  const report = {
    date: Date.now(), correct, total, percent, noRetries, usedRetries, sectionReports,
    questions: state.questions.map(q => ({
      prompt: q.prompt, section: q.section, difficulty: q.difficulty,
      chosen: state.answers[q.id] ? state.answers[q.id].lastChosen : null,
      correctAnswer: q.correctAnswer, wasCorrect: state.answers[q.id] ? !!state.answers[q.id].correct : false,
      explanation: q.explanation
    }))
  };
  report.badges = computeBadgesForAttempt(report);

  const xpEarned = Object.values(state.answers).reduce((s,a)=> s + (a.correct ? (a.attempts===1?10:5) : 0), 0);
  addXP(xpEarned);
  report.xpEarned = xpEarned;

  pushHistory({date: report.date, correct, total, percent, badges: report.badges});
  localStorage.removeItem(LS_SAVE);

  window._lastReport = report;
  go('results');
}

function renderResults(){
  const report = window._lastReport;
  if (!report){ go('home'); return; }
  const stars = report.percent >= 90 ? '⭐⭐⭐' : report.percent >= 70 ? '⭐⭐' : report.percent >= 40 ? '⭐' : '🌱';

  app.innerHTML = `
    <div class="card results-card">
      <h1>${report.percent === 100 ? '🏆 Cum Laude!' : report.percent >= 75 ? '🎉 Great Job!' : '💪 Keep Practising!'}</h1>
      <div class="big-score">${report.correct}/${report.total}</div>
      <div style="font-size:1.2rem;font-weight:800">${report.percent}% · +${report.xpEarned} XP</div>
      <div class="stars-row">${stars}</div>
      <div class="badges-shelf row center">${report.badges.map(b=>`<div class="badge-chip">${b.e}</div>`).join('')}</div>
      <div class="section-report">
        ${report.sectionReports.map(sr => `<div class="sr-row"><span>${sr.emoji} ${sr.name}</span><b>${sr.correct}/${sr.total} (${sr.percent}%)</b></div>`).join('')}
      </div>
      <div class="row center">
        <button class="btn-primary" id="downloadBtn">⬇️ Download Summary</button>
        <button class="btn-warn" id="reviewBtn">🔍 Review Answers</button>
        <button class="btn-good" id="playAgainBtn">🔄 New Quiz</button>
        <button class="btn-secondary" id="homeBtn">🏠 Home</button>
      </div>
    </div>
  `;
  if (report.percent >= 90) launchConfetti(140);

  document.getElementById('downloadBtn').onclick = () => downloadSummary(report);
  document.getElementById('reviewBtn').onclick = () => { reviewFilter = 'all'; go('review'); };
  document.getElementById('playAgainBtn').onclick = () => { state = newQuizState(); saveJSON(LS_SAVE, state); go('quiz'); };
  document.getElementById('homeBtn').onclick = () => go('home');
}

function downloadSummary(report){
  const dateStr = new Date(report.date).toLocaleString();
  const rows = report.questions.map((q,i) => `
    <tr>
      <td style="padding:8px;border:1px solid #ddd">${i+1}</td>
      <td style="padding:8px;border:1px solid #ddd">${sectionNameByKey(q.section)} (${q.difficulty})</td>
      <td style="padding:8px;border:1px solid #ddd">${q.prompt}</td>
      <td style="padding:8px;border:1px solid #ddd">${q.chosen===null?'<i>no answer</i>':q.chosen}</td>
      <td style="padding:8px;border:1px solid #ddd">${q.correctAnswer}</td>
      <td style="padding:8px;border:1px solid #ddd;font-weight:bold;color:${q.wasCorrect?'#204d24':'#7a2420'}">${q.wasCorrect?'Correct':'Incorrect'}</td>
      <td style="padding:8px;border:1px solid #ddd">${q.explanation}</td>
    </tr>`).join('');
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Geography Quest Results – ${dateStr}</title>
  <style>body{font-family:Arial,sans-serif;padding:20px;color:#1b3a3a}h1{color:#2a9d8f}table{border-collapse:collapse;width:100%;font-size:14px}th{background:#e6f5f1;padding:8px;border:1px solid #ddd;text-align:left}</style>
  </head><body>
  <h1>🌍 Geography Quest – Results</h1>
  <p><b>Date:</b> ${dateStr}<br/><b>Score:</b> ${report.correct}/${report.total} (${report.percent}%)<br/><b>Badges earned:</b> ${report.badges.map(b=>b.n).join(', ')}</p>
  <table><thead><tr><th>#</th><th>Topic</th><th>Question</th><th>Your Answer</th><th>Correct Answer</th><th>Result</th><th>Explanation / Memo</th></tr></thead>
  <tbody>${rows}</tbody></table>
  <p style="margin-top:20px;color:#5a7d78">Generated by Geography Quest – keep exploring South Africa's regions!</p>
  </body></html>`;
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `geography-quest-results-${new Date(report.date).toISOString().slice(0,10)}.html`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ===================== CONFETTI ===================== */
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
let confettiParticles = [];
let confettiRAF = null;
function launchConfetti(count){
  const colors = ['#2a9d8f','#264653','#e9c46a','#588157','#457b9d','#dda15e'];
  for (let i=0;i<count;i++){
    confettiParticles.push({
      x: Math.random()*canvas.width, y: -20 - Math.random()*80,
      vx: (Math.random()-0.5)*3, vy: 2+Math.random()*3,
      size: 5+Math.random()*6, color: pick(colors), rot: Math.random()*360, vr:(Math.random()-0.5)*10,
      life: 0, maxLife: 140+Math.random()*60
    });
  }
  if (!confettiRAF) confettiLoop();
}
function confettiLoop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  confettiParticles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.rot += p.vr; p.life++;
    ctx.save();
    ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
    ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, 1 - p.life/p.maxLife);
    ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
    ctx.restore();
  });
  confettiParticles = confettiParticles.filter(p => p.life < p.maxLife && p.y < canvas.height+40);
  if (confettiParticles.length>0){
    confettiRAF = requestAnimationFrame(confettiLoop);
  } else {
    confettiRAF = null;
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }
}

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

/* ===================== INIT ===================== */
render();
